<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級 - 教師管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex flex-col min-h-screen">

    <!-- 老師登入視窗 -->
    <div id="teacher-login-modal" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">教師後台登入</h2>
                <p class="text-xs text-slate-500">請輸入您的教師專屬帳號與密碼</p>
            </div>

            <div class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">教師帳號</label>
                    <input type="text" id="teacher-user" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="請輸入帳號">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">登入密碼</label>
                    <input type="password" id="teacher-pass" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="請輸入密碼">
                </div>
                <div class="flex items-center">
                    <input type="checkbox" id="remember-me" class="w-4 h-4 text-indigo-600 rounded border-slate-300">
                    <label for="remember-me" class="ml-2 text-slate-600 font-medium">記住我 (同時記住帳號與密碼)</label>
                </div>
                <button onclick="directLogin()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition">
                    立即登入後台
                </button>
            </div>
            <div class="text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:underline">返回家長端首頁</a>
            </div>
        </div>
    </div>

    <!-- 教師後台主介面 -->
    <div id="teacher-dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2 rounded-lg">
                        <i class="fa-solid fa-chalkboard-user text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base" id="teacher-header-title">班級 • 教師管理後台</h1>
                        <p class="text-xs text-slate-400">作業與傷病狀態追蹤系統</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openChangePasswordModal()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-key mr-1"></i> 更改帳密
                    </button>
                    <button onclick="location.reload()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                        登出
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
            <div class="flex bg-slate-200 p-1 rounded-xl max-w-2xl mx-auto overflow-x-auto">
                <button onclick="switchTab('homework')" id="tab-hw" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition whitespace-nowrap px-3">作業與訂正</button>
                <button onclick="switchTab('note')" id="tab-note" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3">聯絡簿管理</button>
                <button onclick="switchTab('injury')" id="tab-inj" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3">傷病通知</button>
                <button onclick="switchTab('settings')" id="tab-set" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3"><i class="fa-solid fa-gear mr-1"></i>班級與學生設定</button>
            </div>

            <!-- 1. 作業與訂正管理 (完全與當前聯絡簿同步) -->
            <div id="section-homework" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-list-check text-indigo-600 mr-2"></i>全班作業狀態管理（對應當前聯絡簿項目）</h2>
                    <span id="hw-current-date-tag" class="text-xs bg-indigo-50 text-indigo-700 px-2.5 py-1 rounded-lg font-bold">載入中...</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b" id="teacher-homework-thead">
                                <th class="p-3">座號 / 姓名</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-homework-tbody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 2. 聯絡簿內容與歷史紀錄管理 -->
            <div id="section-note" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-6 max-w-xl mx-auto hidden">
                <div class="space-y-4 bg-amber-50/50 p-4 rounded-xl border border-amber-200">
                    <div class="flex justify-between items-center border-b pb-2">
                        <h2 class="font-bold text-amber-900 text-sm"><i class="fa-solid fa-book text-amber-600 mr-2"></i>編輯聯絡簿內容</h2>
                        <button onclick="prepareNewNote()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1 rounded text-[11px] font-bold shadow transition">
                            <i class="fa-solid fa-plus mr-1"></i> 發布新的一天
                        </button>
                    </div>
                    
                    <div class="space-y-3 text-xs">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">日期（民國年月日與星期）</label>
                            <input type="text" id="note-date" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white" placeholder="例如：民國 115 年 11 月 4 日 (星期三)">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">聯絡簿抄寫內容（每行一項作業，會自動同步至作業區）</label>
                            <textarea id="note-content" rows="4" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1" id="teacher-msg-label">📢 給家長的話 / 老師溫馨提醒</label>
                            <textarea id="note-parent-message" rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white"></textarea>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">叮嚀備註</label>
                            <input type="text" id="note-reminder" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-white">
                        </div>
                        <button onclick="saveContactNote()" class="w-full bg-amber-600 hover:bg-amber-700 text-white font-bold py-2.5 rounded-xl shadow transition">儲存並更新此篇聯絡簿</button>
                    </div>
                </div>

                <!-- 歷史聯絡簿完整列表 -->
                <div class="space-y-3 border-t pt-4">
                    <h3 class="font-bold text-slate-800 text-sm"><i class="fa-solid fa-box-archive text-indigo-600 mr-2"></i>歷史聯絡簿紀錄總覽（點擊可切換當前或修改）</h3>
                    <div class="space-y-3 max-h-72 overflow-y-auto pr-1" id="teacher-history-notes-list"></div>
                </div>
            </div>

            <!-- 3. 傷病通知發送與狀態查詢 -->
            <div id="section-injury" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-6 max-w-2xl mx-auto hidden">
                <div>
                    <h2 class="font-bold text-slate-800 text-sm border-b pb-3"><i class="fa-solid fa-user-nurse text-rose-600 mr-2"></i>發送傷病通知單</h2>
                    <form onsubmit="submitInjuryNotice(event)" class="space-y-3 text-xs mt-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">選擇學生</label>
                            <select id="inj-student-id" required class="w-full px-3 py-2 rounded-lg border border-slate-300"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-medium text-slate-700 mb-1">發生時間</label>
                                <input type="text" id="inj-time" required value="上午 10:15" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                            </div>
                            <div>
                                <label class="block font-medium text-slate-700 mb-1">發生地點</label>
                                <input type="text" id="inj-location" required value="下課遊樂場" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                            </div>
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">受傷症狀</label>
                            <input type="text" id="inj-symptom" required value="右膝擦傷" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">處理經過</label>
                            <textarea id="inj-treatment" rows="2" required class="w-full px-3 py-2 rounded-lg border border-slate-300">生理食鹽水清洗，擦優碘貼人工皮。</textarea>
                        </div>
                        <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl shadow transition">發送通知單</button>
                    </form>
                </div>

                <div class="border-t pt-4">
                    <h3 class="font-bold text-slate-800 text-sm mb-3"><i class="fa-solid fa-clipboard-list text-indigo-600 mr-2"></i>已發送之傷病通知與家長確認狀態</h3>
                    <div class="space-y-3" id="teacher-injury-status-list"></div>
                </div>
            </div>

            <!-- 4. 班級與學生設定 -->
            <div id="section-settings" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-6 max-w-3xl mx-auto hidden">
                <h2 class="font-bold text-slate-800 text-sm border-b pb-3"><i class="fa-solid fa-gear text-indigo-600 mr-2"></i>班級與學生名單自訂管理</h2>
                
                <div class="grid grid-cols-3 gap-3 text-xs bg-slate-50 p-4 rounded-xl border">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">學校名稱</label>
                        <input type="text" id="setting-school" class="w-full px-3 py-2 rounded border border-slate-300">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">班級名稱</label>
                        <input type="text" id="setting-classname" class="w-full px-3 py-2 rounded border border-slate-300">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">老師姓名</label>
                        <input type="text" id="setting-teacher" class="w-full px-3 py-2 rounded border border-slate-300">
                    </div>
                </div>

                <div class="bg-indigo-50/60 p-4 rounded-xl border border-indigo-100 space-y-3 text-xs">
                    <h3 class="font-bold text-indigo-900"><i class="fa-solid fa-user-plus mr-1"></i> 新增或修改學生資料</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" id="new-seat" placeholder="座號 (例如: 01)" class="px-3 py-2 rounded border border-slate-300">
                        <input type="text" id="new-name" placeholder="學生姓名" class="px-3 py-2 rounded border border-slate-300">
                        <input type="text" id="new-id" placeholder="學生學號 (例如: 113056)" class="px-3 py-2 rounded border border-slate-300">
                        <button onclick="addNewStudent()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2 rounded shadow transition">新增/更新學生</button>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-slate-800 text-xs"><i class="fa-solid fa-users mr-1"></i> 現有學生清單 (依座號排列)</h3>
                        <button onclick="saveClassSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2 rounded-lg text-xs shadow transition">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> 儲存所有變更
                        </button>
                    </div>
                    <div class="overflow-x-auto max-h-80 border rounded-xl">
                        <table class="w-full text-left border-collapse text-xs">
                            <thead>
                                <tr class="bg-slate-50 text-slate-600 border-b sticky top-0">
                                    <th class="p-3">座號</th>
                                    <th class="p-3">姓名</th>
                                    <th class="p-3">學號</th>
                                    <th class="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="settings-student-tbody" class="divide-y divide-slate-100"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 更改密碼彈跳視窗 -->
    <div id="password-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 space-y-4 text-xs">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-key text-indigo-600 mr-1"></i> 更改教師後台帳號密碼</h3>
                <button onclick="closeChangePasswordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">新帳號</label>
                    <input type="text" id="new-user" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">新密碼</label>
                    <input type="password" id="new-pass" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                </div>
                <button onclick="saveNewCredentials()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow transition">確認修改</button>
            </div>
        </div>
    </div>

    <script>
        let editingNoteId = null; // 當前編輯中的聯絡簿唯一ID

        window.onload = function() {
            const savedUser = localStorage.getItem('ncm309_remembered_user');
            const savedPass = localStorage.getItem('ncm309_remembered_pass');
            if (savedUser && savedPass) {
                document.getElementById('teacher-user').value = savedUser;
                document.getElementById('teacher-pass').value = savedPass;
                document.getElementById('remember-me').checked = true;
            }
        };

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                localStorage.setItem('ncm309_school_data', JSON.stringify(freshData));
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.teacherAuth) parsed.teacherAuth = { user: "nini309", pass: "20010909" };
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList) parsed.notesList = freshData.notesList;
                if (!parsed.activeNoteId) parsed.activeNoteId = freshData.activeNoteId;
                if (!parsed.students || Object.keys(parsed.students).length < 25) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function generateDefaultData() {
            const names = [
                "黃琨翔", "陳秉軒", "杜晨翔", "劉景碩", "王宇童", 
                "吳立翔", "陳宇恩", "林楷諾", "李柏衡", "林晉翰", 
                "徐堉綸", "紀孟希", "徐晟瀚", "王知言", "蔡佩穎", 
                "鄭詠心", "郭聿芸", "楊茲甯", "王岑芝", "吳涵儒", 
                "洪楀晴", "林芷萱", "潘若穎", "焉語霓", "蘇唯心"
            ];
            const ids = [
                "113056", "113058", "113164", "113166", "113245", 
                "113140", "113248", "113010", "113037", "113279", 
                "113123", "113200", "113015", "113017", "113151", 
                "113284", "113178", "113204", "113021", "113205", 
                "113232", "113208", "113129", "113134", "113212"
            ];
            let students = {};
            ids.forEach((id, index) => {
                let seatNum = String(index + 1);
                students[id] = {
                    name: names[index],
                    seat: seatNum,
                    homeworkStatus: {},
                    injuries: []
                };
            });
            students["123"] = {
                name: "測試帳號",
                seat: "30",
                homeworkStatus: {},
                injuries: []
            };

            const defaultId = new Date().toISOString();
            const defaultNotesList = [
                {
                    id: defaultId,
                    date: "民國 115 年 11 月 4 日 (星期三)",
                    content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷",
                    parentMessage: "本週三有戶外教學。",
                    reminder: "帶外套。"
                }
            ];

            return {
                students: students,
                classInfo: { schoolName: "崇明國小", className: "三年九班", teacherName: "陽芯妮" },
                notesList: defaultNotesList,
                activeNoteId: defaultId,
                teacherAuth: { user: "nini309", pass: "20010909" }
            };
        }

        function saveSystemData(data) {
            localStorage.setItem('ncm309_school_data', JSON.stringify(data));
        }

        function directLogin() {
            const user = document.getElementById('teacher-user').value.trim();
            const pass = document.getElementById('teacher-pass').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;
            const systemData = getSystemData();

            if (user === systemData.teacherAuth.user && pass === systemData.teacherAuth.pass) {
                if (rememberMe) {
                    localStorage.setItem('ncm309_remembered_user', user);
                    localStorage.setItem('ncm309_remembered_pass', pass);
                } else {
                    localStorage.removeItem('ncm309_remembered_user');
                    localStorage.removeItem('ncm309_remembered_pass');
                }

                document.getElementById('teacher-login-modal').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
            } else {
                alert("帳號或密碼錯誤！");
            }
        }

        function loadTeacherData() {
            const systemData = getSystemData();
            const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };
            
            document.getElementById('teacher-header-title').innerText = `${cInfo.className} • 教師管理後台`;
            document.getElementById('teacher-msg-label').innerText = `📢 ${cInfo.teacherName}老師給家長的話 / 溫馨提醒`;

            document.getElementById('setting-school').value = cInfo.schoolName;
            document.getElementById('setting-classname').value = cInfo.className;
            document.getElementById('setting-teacher').value = cInfo.teacherName;

            // 取得當前要管理的聯絡簿
            let activeNote = systemData.notesList.find(n => n.id === systemData.activeNoteId);
            if (!activeNote) {
                activeNote = systemData.notesList[0];
                systemData.activeNoteId = activeNote.id;
            }

            document.getElementById('hw-current-date-tag').innerText = `目前檢視：${activeNote.date}`;

            // 動態產生作業標題列（根據當前聯絡簿內容的每一行）
            const hwLines = activeNote.content.split('\n').filter(line => line.trim() !== '');
            const thead = document.getElementById('teacher-homework-thead');
            let theadHtml = `<th class="p-3">座號 / 姓名</th>`;
            if (hwLines.length === 0) {
                theadHtml += `<th class="p-3 text-slate-400">尚無作業項目（請至聯絡簿管理新增）</th>`;
            } else {
                hwLines.forEach(line => {
                    theadHtml += `<th class="p-3">${line}</th>`;
                });
            }
            thead.innerHTML = theadHtml;

            const sortedIds = Object.keys(systemData.students).sort((a, b) => {
                return parseInt(systemData.students[a].seat) - parseInt(systemData.students[b].seat);
            });

            const tbody = document.getElementById('teacher-homework-tbody');
            const rosterTbody = document.getElementById('settings-student-tbody');
            const selectStudent = document.getElementById('inj-student-id');
            tbody.innerHTML = '';
            rosterTbody.innerHTML = '';
            selectStudent.innerHTML = '';

            sortedIds.forEach(id => {
                const student = systemData.students[id];
                
                selectStudent.innerHTML += `<option value="${id}">${student.seat} 號 - ${student.name} (學號: ${id})</option>`;

                let rowHtml = `<tr class="hover:bg-slate-50"><td class="p-3 font-bold text-slate-700">${student.seat} 號 - ${student.name} <span class="text-xs text-slate-400">(${id})</span></td>`;

                if (hwLines.length === 0) {
                    rowHtml += `<td class="p-3 text-slate-400">-</td>`;
                } else {
                    if (!student.homeworkStatus) student.homeworkStatus = {};
                    if (!student.homeworkStatus[activeNote.id]) student.homeworkStatus[activeNote.id] = {};

                    hwLines.forEach((line, index) => {
                        const currentStatus = student.homeworkStatus[activeNote.id][index] || "3";
                        rowHtml += `
                            <td class="p-3">
                                <select onchange="updateHomework('${id}', '${activeNote.id}', ${index}, this.value)" class="px-2 py-1 rounded border border-slate-300 text-xs font-medium">
                                    <option value="1" ${currentStatus === '1' ? 'selected' : ''}>1. 繳交</option>
                                    <option value="2" ${currentStatus === '2' ? 'selected' : ''}>2. 已補交</option>
                                    <option value="3" ${currentStatus === '3' ? 'selected' : ''}>3. 未完成</option>
                                    <option value="4" ${currentStatus === '4' ? 'selected' : ''}>4. 需訂正、補交</option>
                                </select>
                            </td>
                        `;
                    });
                }
                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;

                rosterTbody.innerHTML += `
                    <tr class="hover:bg-slate-50">
                        <td class="p-3 font-bold text-slate-700">${student.seat} 號</td>
                        <td class="p-3 font-medium text-slate-800">${student.name}</td>
                        <td class="p-3 text-indigo-600 font-mono font-bold">${id}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteStudent('${id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-2.5 py-1 rounded text-xs transition">刪除</button>
                        </td>
                    </tr>
                `;
            });

            loadTeacherNotesManager();

            const injuryStatusList = document.getElementById('teacher-injury-status-list');
            injuryStatusList.innerHTML = '';
            let hasInjury = false;

            sortedIds.forEach(id => {
                const student = systemData.students[id];
                if (student.injuries && student.injuries.length > 0) {
                    student.injuries.forEach(inj => {
                        hasInjury = true;
                        const isConfirmed = inj.confirmed === true;
                        injuryStatusList.innerHTML += `
                            <div class="p-3 rounded-xl bg-slate-50 border text-xs space-y-1">
                                <div class="flex justify-between items-center font-bold">
                                    <span class="text-indigo-700">${student.seat} 號 - ${student.name} (${inj.date} ${inj.time})</span>
                                    <span class="px-2 py-0.5 rounded-full font-medium ${isConfirmed ? 'bg-emerald-100 text-emerald-800' : 'bg-amber-100 text-amber-800'}">
                                        <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                        ${isConfirmed ? '已確認收到 (' + inj.confirmTime + ')' : '未確認'}
                                    </span>
                                </div>
                                <p class="text-slate-700">狀況：${inj.symptom} | 地點：${inj.location}</p>
                                <p class="text-slate-500">處置：${inj.treatment}</p>
                            </div>
                        `;
                    });
                }
            });

            if (!hasInjury) {
                injuryStatusList.innerHTML = `<p class="text-center text-xs text-slate-400 py-2">目前沒有發送任何傷病通知單</p>`;
            }
        }

        function loadTeacherNotesManager() {
            const systemData = getSystemData();
            const listContainer = document.getElementById('teacher-history-notes-list');
            listContainer.innerHTML = '';

            systemData.notesList.forEach(note => {
                const isActive = note.id === systemData.activeNoteId;
                listContainer.innerHTML += `
                    <div class="p-3 rounded-xl ${isActive ? 'bg-amber-50 border-amber-300' : 'bg-slate-50 border-slate-200'} border text-xs space-y-2">
                        <div class="flex justify-between items-center font-bold ${isActive ? 'text-amber-900' : 'text-slate-700'}">
                            <span>${isActive ? '📌 【當前顯示中】' : '📜'} 聯絡簿 (${note.date})</span>
                            <div class="flex gap-1">
                                ${!isActive ? `<button onclick="setActiveNote('${note.id}')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-2.5 py-1 rounded text-[11px] shadow transition">設為當前</button>` : ''}
                                <button onclick="editNote('${note.id}')" class="bg-indigo-600 hover:bg-indigo-700 text-white px-2.5 py-1 rounded text-[11px] shadow transition">編輯</button>
                            </div>
                        </div>
                        <p class="text-slate-600 whitespace-pre-line">${note.content}</p>
                    </div>
                `;
            });

            // 預設將編輯器載入當前啟用的聯絡簿
            editNote(systemData.activeNoteId);
        }

        function setActiveNote(id) {
            const systemData = getSystemData();
            systemData.activeNoteId = id;
            saveSystemData(systemData);
            loadTeacherData();
            alert("已成功切換當前顯示的聯絡簿！作業區已同步更新。");
        }

        function editNote(id) {
            editingNoteId = id;
            const systemData = getSystemData();
            const note = systemData.notesList.find(n => n.id === id);
            if (!note) return;

            document.getElementById('note-date').value = note.date;
            document.getElementById('note-content').value = note.content;
            document.getElementById('note-parent-message').value = note.parentMessage || "";
            document.getElementById('note-reminder').value = note.reminder || "";
        }

        function prepareNewNote() {
            editingNoteId = 'new';
            const now = new Date();
            document.getElementById('note-date').value = `民國 115 年 ${now.getMonth() + 1} 月 ${now.getDate()} 日 (星期三)`;
            document.getElementById('note-content').value = "";
            document.getElementById('note-parent-message').value = "";
            document.getElementById('note-reminder').value = "";
            alert("已準備好發布新的一天聯絡簿！填寫完畢後點擊下方儲存即可。");
        }

        function updateHomework(studentId, noteId, hwIndex, newStatus) {
            const systemData = getSystemData();
            if (!systemData.students[studentId].homeworkStatus) {
                systemData.students[studentId].homeworkStatus = {};
            }
            if (!systemData.students[studentId].homeworkStatus[noteId]) {
                systemData.students[studentId].homeworkStatus[noteId] = {};
            }
            systemData.students[studentId].homeworkStatus[noteId][hwIndex] = newStatus;
            saveSystemData(systemData);
        }

        function saveContactNote() {
            const systemData = getSystemData();
            const updatedNoteData = {
                date: document.getElementById('note-date').value,
                content: document.getElementById('note-content').value,
                parentMessage: document.getElementById('note-parent-message').value,
                reminder: document.getElementById('note-reminder').value
            };

            if (editingNoteId === 'new') {
                const newId = new Date().toISOString();
                systemData.notesList.unshift({ id: newId, ...updatedNoteData });
                systemData.activeNoteId = newId; // 自動設為當前
            } else {
                const idx = systemData.notesList.findIndex(n => n.id === editingNoteId);
                if (idx !== -1) {
                    systemData.notesList[idx] = { id: editingNoteId, ...updatedNoteData };
                }
            }
            
            saveSystemData(systemData);
            alert("聯絡簿與對應作業已成功儲存與更新！");
            loadTeacherData();
        }

        function addNewStudent() {
            const seat = document.getElementById('new-seat').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const id = document.getElementById('new-id').value.trim();

            if (!seat || !name || !id) {
                alert("請完整填寫座號、姓名與學號！");
                return;
            }

            const systemData = getSystemData();
            systemData.students[id] = {
                name: name,
                seat: seat,
                homeworkStatus: {},
                injuries: []
            };

            saveSystemData(systemData);
            alert(`已成功新增/更新學生：${seat} 號 ${name}！`);
            document.getElementById('new-seat').value = '';
            document.getElementById('new-name').value = '';
            document.getElementById('new-id').value = '';
            loadTeacherData();
        }

        function deleteStudent(id) {
            if (confirm("確定要刪除這位學生嗎？")) {
                const systemData = getSystemData();
                delete systemData.students[id];
                saveSystemData(systemData);
                loadTeacherData();
            }
        }

        function saveClassSettings() {
            const systemData = getSystemData();
            systemData.classInfo = {
                schoolName: document.getElementById('setting-school').value.trim(),
                className: document.getElementById('setting-classname').value.trim(),
                teacherName: document.getElementById('setting-teacher').value.trim()
            };
            saveSystemData(systemData);
            alert("班級基本設定已成功儲存！");
            loadTeacherData();
        }

        function submitInjuryNotice(event) {
            event.preventDefault();
            const studentId = document.getElementById('inj-student-id').value;
            const newInjury = {
                date: "民國 115 年 11 月 4 日",
                time: document.getElementById('inj-time').value,
                location: document.getElementById('inj-location').value,
                symptom: document.getElementById('inj-symptom').value,
                treatment: document.getElementById('inj-treatment').value,
                nurse: "張護理師",
                confirmed: false,
                confirmTime: null
            };

            const systemData = getSystemData();
            if (!systemData.students[studentId].injuries) {
                systemData.students[studentId].injuries = [];
            }
            systemData.students[studentId].injuries.unshift(newInjury);
            saveSystemData(systemData);
            alert("傷病通知單已成功發送！");
            loadTeacherData();
        }

        function openChangePasswordModal() {
            const systemData = getSystemData();
            document.getElementById('new-user').value = systemData.teacherAuth.user;
            document.getElementById('new-pass').value = systemData.teacherAuth.pass;
            document.getElementById('password-modal').classList.remove('hidden');
        }

        function closeChangePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        function saveNewCredentials() {
            const newUser = document.getElementById('new-user').value.trim();
            const newPass = document.getElementById('new-pass').value.trim();
            if (!newUser || !newPass) {
                alert("帳號與密碼不得為空白！");
                return;
            }
            const systemData = getSystemData();
            systemData.teacherAuth.user = newUser;
            systemData.teacherAuth.pass = newPass;
            saveSystemData(systemData);
            alert("教師帳號密碼已成功更新！");
            closeChangePasswordModal();
        }

        function switchTab(tab) {
            document.getElementById('tab-hw').className = tab === 'homework' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition whitespace-nowrap px-3" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3";
            document.getElementById('tab-note').className = tab === 'note' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition whitespace-nowrap px-3" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3";
            document.getElementById('tab-inj').className = tab === 'injury' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition whitespace-nowrap px-3" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3";
            document.getElementById('tab-set').className = tab === 'settings' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition whitespace-nowrap px-3" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition whitespace-nowrap px-3";

            document.getElementById('section-homework').classList.toggle('hidden', tab !== 'homework');
            document.getElementById('section-note').classList.toggle('hidden', tab !== 'note');
            document.getElementById('section-injury').classList.toggle('hidden', tab !== 'injury');
            document.getElementById('section-settings').classList.toggle('hidden', tab !== 'settings');
        }
    </script>
</body>
</html>
