<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>309 班級 - 教師管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex flex-col min-h-screen">

    <!-- 老師登入視窗 -->
    <div id="teacher-login-modal" class="fixed inset-0 bg-slate-900 z-50 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-2xl p-6 space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-xl">
                    <i class="fa-solid fa-lock"></i>
                </div>
                <h2 class="text-lg font-bold text-slate-800">教師後台身份驗證</h2>
                <p class="text-xs text-slate-500">預設帳號：<span class="font-bold text-indigo-600">teacher309</span> / 密碼：<span class="font-bold text-indigo-600">123456</span></p>
            </div>

            <form onsubmit="handleTeacherLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">教師帳號</label>
                    <input type="text" id="teacher-user" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="請輸入帳號">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">登入密碼</label>
                    <input type="password" id="teacher-pass" required class="w-full px-3 py-2.5 rounded-xl border border-slate-300 outline-none focus:ring-2 focus:ring-indigo-500" placeholder="請輸入密碼">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition">
                    安全登入後台
                </button>
            </form>
            <div class="text-center">
                <a href="index.html" class="text-xs text-slate-400 hover:underline">返回家長端首頁</a>
            </div>
        </div>
    </div>

    <!-- 教師後台主介面 -->
    <div id="teacher-dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-slate-900 text-white shadow-md sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-indigo-600 p-2 rounded-lg">
                        <i class="fa-solid fa-chalkboard-user text-lg"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base">三年九班 • 教師管理後台</h1>
                        <p class="text-xs text-slate-400">即時管理系統</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="openChangePasswordModal()" class="text-xs bg-indigo-600 hover:bg-indigo-700 text-white px-3 py-1.5 rounded-lg transition">
                        <i class="fa-solid fa-key mr-1"></i> 更改帳密
                    </button>
                    <button onclick="location.reload()" class="text-xs bg-slate-800 hover:bg-slate-700 text-slate-300 px-3 py-1.5 rounded-lg border border-slate-700">
                        登出
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
            <div class="flex bg-slate-200 p-1 rounded-xl max-w-lg mx-auto">
                <button onclick="switchTab('homework')" id="tab-hw" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition">作業點收</button>
                <button onclick="switchTab('note')" id="tab-note" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">聯絡簿與給家長的話</button>
                <button onclick="switchTab('injury')" id="tab-inj" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">傷病通知</button>
            </div>

            <!-- 作業點收 -->
            <div id="section-homework" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                <h2 class="font-bold text-slate-800 text-sm border-b pb-3"><i class="fa-solid fa-list-check text-indigo-600 mr-2"></i>全班作業點收表 (勾選即自動同步)</h2>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b">
                                <th class="p-3">座號 / 姓名</th>
                                <th class="p-3">國文習作第 4 課</th>
                                <th class="p-3">數學隨堂練習卷</th>
                                <th class="p-3">社會課本預習</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-homework-tbody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>

            <!-- 聯絡簿內容與給家長的話 -->
            <div id="section-note" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 max-w-lg mx-auto hidden">
                <h2 class="font-bold text-slate-800 text-sm border-b pb-3"><i class="fa-solid fa-book text-indigo-600 mr-2"></i>發布今日聯絡簿與給家長的話</h2>
                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">日期</label>
                        <input type="text" id="note-date" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">聯絡簿抄寫內容</label>
                        <textarea id="note-content" rows="4" class="w-full px-3 py-2 rounded-lg border border-slate-300"></textarea>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">📢 給家長的話 / 老師溫馨提醒</label>
                        <textarea id="note-parent-message" rows="3" class="w-full px-3 py-2 rounded-lg border border-slate-300 bg-amber-50/50"></textarea>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">叮嚀備註</label>
                        <input type="text" id="note-reminder" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                    </div>
                    <button onclick="saveContactNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow transition">儲存並同步至家長端</button>
                </div>
            </div>

            <!-- 傷病通知 -->
            <div id="section-injury" class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 max-w-lg mx-auto hidden">
                <h2 class="font-bold text-slate-800 text-sm border-b pb-3"><i class="fa-solid fa-user-nurse text-rose-600 mr-2"></i>發送傷病通知單</h2>
                <form onsubmit="submitInjuryNotice(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">選擇學生</label>
                        <select id="inj-student-id" required class="w-full px-3 py-2 rounded-lg border border-slate-300">
                            <option value="30901">30901 - 王小明</option>
                            <option value="30902">30902 - 李小華</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">發生時間</label>
                            <input type="text" id="inj-time" required value="上午 10:15" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">發生地點</label>
                            <input type="text" id="inj-location" required value="下課遊樂場" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                        </div>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">受傷症狀</label>
                        <input type="text" id="inj-symptom" required value="右膝擦傷" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">處理經過</label>
                        <textarea id="inj-treatment" rows="3" required class="w-full px-3 py-2 rounded-lg border border-slate-300">生理食鹽水清洗，擦優碘貼人工皮。</textarea>
                    </div>
                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl shadow transition">發送通知單</button>
                </form>
            </div>
        </main>
    </div>

    <!-- 更改密碼彈跳視窗 -->
    <div id="password-modal" class="fixed inset-0 bg-black/50 z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-white w-full max-w-sm rounded-2xl shadow-xl p-6 space-y-4 text-xs">
            <div class="flex justify-between items-center border-b pb-2">
                <h3 class="font-bold text-sm text-slate-800"><i class="fa-solid fa-key text-indigo-600 mr-1"></i> 更改教師後台帳號密碼</h3>
                <button onclick="closeChangePasswordModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-base"></i></button>
            </div>
            <div class="space-y-3">
                <div>
                    <label class="block font-medium text-slate-700 mb-1">新帳號</label>
                    <input type="text" id="new-user" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                </div>
                <div>
                    <label class="block font-medium text-slate-700 mb-1">新密碼</label>
                    <input type="password" id="new-pass" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                </div>
                <button onclick="saveNewCredentials()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow transition">確認修改</button>
            </div>
        </div>
    </div>

    <script>
        function getSystemData() {
            try {
                const data = localStorage.getItem('ncm309_school_data');
                if (!data) {
                    return resetDefaultData();
                }
                return JSON.parse(data);
            } catch (e) {
                console.error("資料讀取錯誤，已自動重設：", e);
                return resetDefaultData();
            }
        }

        function resetDefaultData() {
            const defaultData = {
                students: {
                    "30901": { name: "王小明", seat: "01", homework: [{ name: "國文習作第 4 課", status: "submitted" }, { name: "數學隨堂練習卷", status: "submitted" }, { name: "社會課本預習", status: "pending" }], injuries: [] },
                    "30902": { name: "李小華", seat: "02", homework: [{ name: "國文習作第 4 課", status: "submitted" }, { name: "數學隨堂練習卷", status: "pending" }, { name: "社會課本預習", status: "pending" }], injuries: [] }
                },
                contactNote: { 
                    date: "2026 年 11 月 2 日 (星期一)", 
                    content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷訂正", 
                    parentMessage: "各位家長好，本週三有戶外教學，請記得幫孩子準備輕便雨衣與水壺。",
                    reminder: "記得帶外套。" 
                },
                teacherAuth: { user: "teacher309", pass: "123456" }
            };
            localStorage.setItem('ncm309_school_data', JSON.stringify(defaultData));
            return defaultData;
        }

        function saveSystemData(data) {
            localStorage.setItem('ncm309_school_data', JSON.stringify(data));
        }

        function handleTeacherLogin(event) {
            event.preventDefault();
            const user = document.getElementById('teacher-user').value.trim();
            const pass = document.getElementById('teacher-pass').value.trim();
            
            const systemData = getSystemData();

            if (user === systemData.teacherAuth.user && pass === systemData.teacherAuth.pass) {
                document.getElementById('teacher-login-modal').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
            } else {
                alert("帳號或密碼錯誤！\n（預設帳號：teacher309，密碼：123456）");
            }
        }

        function loadTeacherData() {
            const systemData = getSystemData();
            const tbody = document.getElementById('teacher-homework-tbody');
            tbody.innerHTML = '';

            Object.keys(systemData.students).forEach(id => {
                const student = systemData.students[id];
                let rowHtml = `<tr class="hover:bg-slate-50"><td class="p-3 font-bold text-slate-700">${student.seat} - ${student.name}</td>`;

                student.homework.forEach((hw, index) => {
                    const isChecked = hw.status === 'submitted';
                    rowHtml += `
                        <td class="p-3">
                            <label class="inline-flex items-center cursor-pointer gap-2">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleHomework('${id}', ${index}, this.checked)" class="w-4 h-4 text-indigo-600 rounded">
                                <span class="${isChecked ? 'text-emerald-600 font-medium' : 'text-slate-400'}">${isChecked ? '已交' : '未交'}</span>
                            </label>
                        </td>
                    `;
                });
                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            });

            document.getElementById('note-date').value = systemData.contactNote.date;
            document.getElementById('note-content').value = systemData.contactNote.content;
            document.getElementById('note-parent-message').value = systemData.contactNote.parentMessage || "";
            document.getElementById('note-reminder').value = systemData.contactNote.reminder;
        }

        function toggleHomework(studentId, hwIndex, isChecked) {
            const systemData = getSystemData();
            systemData.students[studentId].homework[hwIndex].status = isChecked ? 'submitted' : 'pending';
            saveSystemData(systemData);
        }

        function saveContactNote() {
            const systemData = getSystemData();
            systemData.contactNote.date = document.getElementById('note-date').value;
            systemData.contactNote.content = document.getElementById('note-content').value;
            systemData.contactNote.parentMessage = document.getElementById('note-parent-message').value;
            systemData.contactNote.reminder = document.getElementById('note-reminder').value;
            saveSystemData(systemData);
            alert("聯絡簿與給家長的話已成功同步至家長端！");
        }

        function submitInjuryNotice(event) {
            event.preventDefault();
            const studentId = document.getElementById('inj-student-id').value;
            const newInjury = {
                date: "2026-11-02",
                time: document.getElementById('inj-time').value,
                location: document.getElementById('inj-location').value,
                symptom: document.getElementById('inj-symptom').value,
                treatment: document.getElementById('inj-treatment').value,
                nurse: "張護理師"
            };

            const systemData = getSystemData();
            if (!systemData.students[studentId].injuries) {
                systemData.students[studentId].injuries = [];
            }
            systemData.students[studentId].injuries.unshift(newInjury);
            saveSystemData(systemData);
            alert("傷病通知單已成功發送！");
        }

        function openChangePasswordModal() {
            const systemData = getSystemData();
            document.getElementById('new-user').value = systemData.teacherAuth.user;
            document.getElementById('new-pass').value = systemData.teacherAuth.pass;
            document.getElementById('password-modal').classList.remove('hidden');
        }

        function closeChangePasswordModal() {
            document.getElementById('password-modal').classList.add('hidden');
        }

        function saveNewCredentials() {
            const newUser = document.getElementById('new-user').value.trim();
            const newPass = document.getElementById('new-pass').value.trim();
            if (!newUser || !newPass) {
                alert("帳號與密碼不得為空白！");
                return;
            }
            const systemData = getSystemData();
            systemData.teacherAuth.user = newUser;
            systemData.teacherAuth.pass = newPass;
            saveSystemData(systemData);
            alert("教師帳號密碼已成功更新！");
            closeChangePasswordModal();
        }

        function switchTab(tab) {
            document.getElementById('tab-hw').className = tab === 'homework' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
            document.getElementById('tab-note').className = tab === 'note' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
            document.getElementById('tab-inj').className = tab === 'injury' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";

            document.getElementById('section-homework').classList.toggle('hidden', tab !== 'homework');
            document.getElementById('section-note').classList.toggle('hidden', tab !== 'note');
            document.getElementById('section-injury').classList.toggle('hidden', tab !== 'injury');
        }
    </script>
</body>
</html>
