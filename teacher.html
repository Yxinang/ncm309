<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級 - 教師管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #E6F4F1; font-family: system-ui, -apple-system, sans-serif; color: #2F4F4F; }
        .soft-card { background-color: #FFFFFF; border: 2px solid #A3D2CA; border-radius: 28px; box-shadow: 0 4px 12px rgba(47, 79, 79, 0.05); }
        .soft-header { background-color: #F0F7F6; border-bottom: 2px solid #A3D2CA; border-top-left-radius: 25px; border-top-right-radius: 25px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- 老師登入視窗 -->
    <div id="teacher-login-modal" class="fixed inset-0 bg-[#2F4F4F]/40 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="soft-card w-full max-w-sm p-6 space-y-6">
            <div class="text-center space-y-3">
                <div class="w-16 h-16 bg-[#C8E6C9] text-[#2F4F4F] rounded-3xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-shield-cat"></i>
                </div>
                <h2 class="text-xl font-bold text-[#2F4F4F]">教師溫馨後台</h2>
                <p class="text-xs text-[#598379]">請輸入教師專屬帳號與密碼 (t309 / 0909)</p>
            </div>

            <div class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1">教師帳號</label>
                    <input type="text" id="teacher-user" class="w-full px-4 py-3 rounded-2xl border-2 border-[#A3D2CA] bg-[#F0F7F6] outline-none focus:ring-2 focus:ring-[#598379] font-medium" placeholder="請輸入帳號">
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1">登入密碼</label>
                    <input type="password" id="teacher-pass" class="w-full px-4 py-3 rounded-2xl border-2 border-[#A3D2CA] bg-[#F0F7F6] outline-none focus:ring-2 focus:ring-[#598379] font-medium" placeholder="請輸入密碼">
                </div>
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="remember-me" class="w-5 h-5 text-[#598379] rounded border-[#A3D2CA]">
                    <label for="remember-me" class="ml-2 text-[#2F4F4F] font-bold text-xs">記住我 (帳號與密碼)</label>
                </div>
                <button onclick="directLogin()" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3.5 rounded-2xl shadow-md transition text-base">
                    立即登入後台 💛
                </button>
            </div>
            <div class="text-center pt-2">
                <a href="index.html" class="text-xs text-[#598379] hover:underline font-bold">返回家長端首頁</a>
            </div>
        </div>
    </div>

    <!-- 教師後台主介面 -->
    <div id="teacher-dashboard" class="hidden flex flex-col min-h-screen">
        <header class="bg-[#598379] text-white shadow-sm sticky top-0 z-40">
            <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
                <div class="flex items-center space-x-3">
                    <div class="bg-white/80 p-2 rounded-2xl text-[#2F4F4F] shadow-sm">
                        <i class="fa-solid fa-chalkboard-user text-base"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-base" id="teacher-header-title">班級 • 教師溫馨後台</h1>
                        <p class="text-xs text-[#E6F4F1]">作業與傷病狀態追蹤系統</p>
                    </div>
                </div>
                <div class="flex items-center gap-2">
                    <button onclick="logoutTeacher()" class="text-xs bg-[#C8E6C9] hover:bg-[#A5D6A7] text-[#2F4F4F] px-3.5 py-2 rounded-xl font-bold transition shadow-sm">
                        登出後台
                    </button>
                </div>
            </div>
        </header>

        <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">
            <div class="flex bg-[#D8E8E5] p-1.5 rounded-2xl max-w-2xl mx-auto overflow-x-auto border-2 border-[#A3D2CA]">
                <button onclick="switchTab('homework')" id="tab-hw" class="flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition whitespace-nowrap px-4">作業與訂正</button>
                <button onclick="switchTab('note')" id="tab-note" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4">聯絡簿管理</button>
                <button onclick="switchTab('injury')" id="tab-inj" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4">傷病通知</button>
                <button onclick="switchTab('settings')" id="tab-set" class="flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4"><i class="fa-solid fa-gear mr-1"></i>班級設定</button>
            </div>

            <!-- 1. 作業與訂正管理 -->
            <div id="section-homework" class="soft-card p-5 space-y-4">
                <div class="soft-header px-4 py-2.5 flex justify-between items-center -mx-5 -mt-5 mb-3">
                    <h2 class="font-bold text-[#2F4F4F] text-sm"><i class="fa-solid fa-list-check text-[#598379] mr-2"></i>全班作業狀態管理</h2>
                    <span id="hw-current-date-tag" class="text-xs bg-[#C8E6C9] text-[#2F4F4F] px-3.5 py-1 rounded-full font-bold shadow-sm">載入中...</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-sm">
                        <thead>
                            <tr class="bg-[#F0F7F6] text-[#2F4F4F] border-b-2 border-[#A3D2CA] font-bold" id="teacher-homework-thead">
                                <th class="p-3">座號 / 姓名</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-homework-tbody" class="divide-y divide-[#E0F2F1]"></tbody>
                    </table>
                </div>
            </div>

            <!-- 2. 聯絡簿內容與管理 -->
            <div id="section-note" class="soft-card p-5 space-y-6 max-w-xl mx-auto hidden">
                <div class="space-y-4 bg-[#F0F7F6] p-5 rounded-2xl border border-[#A3D2CA]">
                    <div class="flex justify-between items-center border-b border-[#A3D2CA] pb-2">
                        <h2 class="font-bold text-[#2F4F4F] text-sm"><i class="fa-solid fa-book text-[#598379] mr-2"></i>編輯聯絡簿與自訂時間</h2>
                        <button onclick="prepareNewNote()" class="bg-[#598379] hover:bg-[#4A6B63] text-white px-3.5 py-2 rounded-xl text-xs font-bold shadow-sm transition">
                            <i class="fa-solid fa-plus mr-1"></i> 發布新的一天
                        </button>
                    </div>
                    
                    <div class="space-y-3 text-sm">
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">📅 自訂聯絡簿時間（系統將依台北時間自動對應正確星期）</label>
                            <input type="text" id="note-date" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium" placeholder="例如：民國 115 年 11 月 5 日 (星期四)">
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">當天聯絡簿抄寫內容（每行一項作業）</label>
                            <textarea id="note-content" rows="4" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1" id="teacher-msg-label">📢 老師提醒 / 給家長的話</label>
                            <textarea id="note-parent-message" rows="3" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium"></textarea>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">🤝 需家長協助完成之作業 / 親子共學（打字輸入填寫）</label>
                            <textarea id="note-parent-assist" rows="2" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium" placeholder="請在此打字輸入需家長協助之未繳交或配合事項..."></textarea>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">叮嚀備註</label>
                            <input type="text" id="note-reminder" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                        </div>
                        <button onclick="saveContactNote()" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3.5 rounded-2xl shadow-md transition text-base">儲存並更新此篇聯絡簿 💛</button>
                    </div>
                </div>

                <div class="space-y-3 border-t border-[#A3D2CA] pt-4">
                    <h3 class="font-bold text-[#2F4F4F] text-sm"><i class="fa-solid fa-box-archive text-[#598379] mr-2"></i>歷史聯絡簿紀錄總覽（永久保留，隨時翻閱或刪除）</h3>
                    <div class="space-y-3 max-h-72 overflow-y-auto pr-1" id="teacher-history-notes-list"></div>
                </div>
            </div>

            <!-- 3. 傷病通知發送與狀態查詢 -->
            <div id="section-injury" class="soft-card p-5 space-y-6 max-w-2xl mx-auto hidden">
                <div>
                    <h2 class="font-bold text-[#2F4F4F] text-sm border-b border-[#A3D2CA] pb-3"><i class="fa-solid fa-user-nurse text-rose-500 mr-2"></i>發送傷病通知單</h2>
                    <form onsubmit="submitInjuryNotice(event)" class="space-y-3 text-sm mt-3">
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">選擇學生</label>
                            <select id="inj-student-id" required class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-[#F0F7F6] font-medium"></select>
                        </div>
                        <div class="grid grid-cols-2 gap-3">
                            <div>
                                <label class="block font-bold text-[#2F4F4F] mb-1">發生時間</label>
                                <input type="text" id="inj-time" required value="上午 10:15" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                            </div>
                            <div>
                                <label class="block font-bold text-[#2F4F4F] mb-1">處理人員</label>
                                <select id="inj-nurse" required class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                                    <option value="保健室">選項一：保健室</option>
                                    <option value="教室觀察">選項二：教室觀察</option>
                                </select>
                            </div>
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">發生地點</label>
                            <input type="text" id="inj-location" required value="下課遊樂場" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">受傷症狀</label>
                            <input type="text" id="inj-symptom" required value="右膝擦傷" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                        </div>
                        <div>
                            <label class="block font-bold text-[#2F4F4F] mb-1">處理經過</label>
                            <textarea id="inj-treatment" rows="2" required class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">生理食鹽水清洗，擦優碘貼人工皮。</textarea>
                        </div>
                        <button type="submit" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-2xl shadow-md transition text-base">發送傷病通知單 🩹</button>
                    </form>
                </div>

                <div class="border-t border-[#A3D2CA] pt-4">
                    <h3 class="font-bold text-[#2F4F4F] text-sm mb-3"><i class="fa-solid fa-clipboard-list text-rose-500 mr-2"></i>已發送之傷病通知（每位學生獨立分開永久記錄）</h3>
                    <div class="space-y-3" id="teacher-injury-status-list"></div>
                </div>
            </div>

            <!-- 4. 班級與學生設定 -->
            <div id="section-settings" class="soft-card p-5 space-y-6 max-w-3xl mx-auto hidden">
                <h2 class="font-bold text-[#2F4F4F] text-sm border-b border-[#A3D2CA] pb-3"><i class="fa-solid fa-gear text-[#598379] mr-2"></i>班級與學生名單自訂管理</h2>
                
                <div class="grid grid-cols-3 gap-3 text-sm bg-[#F0F7F6] p-4 rounded-2xl border border-[#A3D2CA]">
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">學校名稱</label>
                        <input type="text" id="setting-school" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">班級名稱</label>
                        <input type="text" id="setting-classname" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">老師姓名</label>
                        <input type="text" id="setting-teacher" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                    </div>
                </div>

                <div class="bg-[#E0F2F1] p-4 rounded-2xl border border-[#A3D2CA] space-y-3 text-sm">
                    <h3 class="font-bold text-[#2F4F4F]"><i class="fa-solid fa-user-plus mr-1"></i> 新增或修改學生資料</h3>
                    <div class="grid grid-cols-4 gap-2">
                        <input type="text" id="new-seat" placeholder="座號 (01)" class="px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                        <input type="text" id="new-name" placeholder="學生姓名" class="px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                        <input type="text" id="new-id" placeholder="學生學號" class="px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                        <button onclick="addNewStudent()" class="bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3 rounded-xl shadow-sm transition">新增/更新</button>
                    </div>
                </div>

                <div class="space-y-3">
                    <div class="flex justify-between items-center">
                        <h3 class="font-bold text-[#2F4F4F] text-sm"><i class="fa-solid fa-users mr-1"></i> 現有學生清單 (依座號排列)</h3>
                        <button onclick="saveClassSettings()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold px-4 py-2.5 rounded-xl text-sm shadow-sm transition">
                            <i class="fa-solid fa-floppy-disk mr-1"></i> 儲存所有變更
                        </button>
                    </div>
                    <div class="overflow-x-auto max-h-80 border border-[#A3D2CA] rounded-2xl">
                        <table class="w-full text-left border-collapse text-sm">
                            <thead>
                                <tr class="bg-[#F0F7F6] text-[#2F4F4F] border-b border-[#A3D2CA] sticky top-0 font-bold">
                                    <th class="p-3">座號</th>
                                    <th class="p-3">姓名</th>
                                    <th class="p-3">學號</th>
                                    <th class="p-3 text-center">操作</th>
                                </tr>
                            </thead>
                            <tbody id="settings-student-tbody" class="divide-y divide-[#E0F2F1]"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <!-- 修改傷病通知彈跳視窗 -->
    <div id="injury-edit-modal" class="fixed inset-0 bg-[#2F4F4F]/40 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="soft-card w-full max-w-md p-6 space-y-4 text-sm">
            <div class="flex justify-between items-center border-b border-[#A3D2CA] pb-2">
                <h3 class="font-bold text-base text-[#2F4F4F]"><i class="fa-solid fa-pen-to-square text-rose-500 mr-1"></i> 修改傷病通知單</h3>
                <button onclick="closeInjuryEditModal()" class="text-slate-400 hover:text-slate-600"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <input type="hidden" id="edit-inj-student-id">
            <input type="hidden" id="edit-inj-index">
            <div class="space-y-3">
                <div class="grid grid-cols-2 gap-2">
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">發生時間</label>
                        <input type="text" id="edit-inj-time" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium">
                    </div>
                    <div>
                        <label class="block font-bold text-[#2F4F4F] mb-1">處理人員</label>
                        <select id="edit-inj-nurse" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] bg-white font-medium">
                            <option value="保健室">選項一：保健室</option>
                            <option value="教室觀察">選項二：教室觀察</option>
                        </select>
                    </div>
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1">發生地點</label>
                    <input type="text" id="edit-inj-location" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium">
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1">受傷症狀</label>
                    <input type="text" id="edit-inj-symptom" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium">
                </div>
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1">處理經過</label>
                    <textarea id="edit-inj-treatment" rows="3" class="w-full px-3.5 py-3 rounded-xl border border-[#A3D2CA] font-medium"></textarea>
                </div>
                <button onclick="saveInjuryEdit()" class="w-full bg-rose-500 hover:bg-rose-600 text-white font-bold py-3.5 rounded-2xl shadow-sm transition text-base">確認修改儲存</button>
            </div>
        </div>
    </div>

    <script>
        const CLOUD_BIN_URL = 'https://api.jsonbin.io/v3/b/65f6c82d3dcbb1b7cc342831';
        let editingNoteId = null;

        const FIXED_TEACHER_USER = "t309";
        const FIXED_TEACHER_PASS = "0909";

        window.onload = async function() {
            await syncLoadData();
            const savedUser = localStorage.getItem('ncm309_remembered_user');
            const savedPass = localStorage.getItem('ncm309_remembered_pass');
            if (savedUser && savedPass) {
                document.getElementById('teacher-user').value = savedUser;
                document.getElementById('teacher-pass').value = savedPass;
                document.getElementById('remember-me').checked = true;
            }

            const isTeacherLogged = sessionStorage.getItem('ncm309_teacher_logged');
            if (isTeacherLogged === 'true') {
                document.getElementById('teacher-login-modal').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
            }
        };

        async function syncLoadData() {
            try {
                const response = await fetch(`${CLOUD_BIN_URL}/latest`, {
                    headers: { 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' }
                });
                if (response.ok) {
                    const cloudResult = await response.json();
                    if (cloudResult && cloudResult.record) {
                        if (cloudResult.record.notesList && Array.isArray(cloudResult.record.notesList)) {
                            cloudResult.record.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
                        }
                        localStorage.setItem('ncm309_school_data', JSON.stringify(cloudResult.record));
                    }
                }
            } catch (e) {
                console.log("使用本地快取資料");
            }
        }

        async function saveSystemData(data) {
            if (data.notesList && Array.isArray(data.notesList)) {
                data.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
            }
            localStorage.setItem('ncm309_school_data', JSON.stringify(data));
            try {
                await fetch(CLOUD_BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' },
                    body: JSON.stringify(data)
                });
            } catch (e) {
                console.log("雲端同步失敗，已儲存於本地");
            }
        }

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                localStorage.setItem('ncm309_school_data', JSON.stringify(freshData));
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList || parsed.notesList.length === 0) {
                    parsed.notesList = freshData.notesList;
                } else {
                    parsed.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
                }
                if (!parsed.students || Object.keys(parsed.students).length < 25) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function getTaiwanTaipeiDateString() {
            const now = new Date();
            return formatTaiwanTaipeiDate(now);
        }

        function formatTaiwanTaipeiDate(dateObj) {
            const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long' };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            const parts = formatter.formatToParts(dateObj);
            
            let year = '', month = '', day = '', weekday = '';
            parts.forEach(part => {
                if (part.type === 'year') year = parseInt(part.value) - 1911;
                if (part.type === 'month') month = part.value;
                if (part.type === 'day') day = part.value;
                if (part.type === 'weekday') weekday = part.value;
            });
            return `民國 ${year} 年 ${month} 月 ${day} 日 (${weekday})`;
        }

        function parseAndCorrectDateString(inputStr) {
            if (!inputStr) return getTaiwanTaipeiDateString();
            const match = inputStr.match(/(?:民國\s*(\d+)\s*年)?\s*(\d+)\s*月\s*(\d+)\s*日/);
            if (match) {
                let year = match[1] ? parseInt(match[1]) + 1911 : new Date().getFullYear();
                let month = parseInt(match[2]) - 1;
                let day = parseInt(match[3]);
                const targetDate = new Date(year, month, day);
                if (!isNaN(targetDate.getTime())) {
                    return formatTaiwanTaipeiDate(targetDate);
                }
            }
            return inputStr;
        }

        function directLogin() {
            const user = document.getElementById('teacher-user').value.trim();
            const pass = document.getElementById('teacher-pass').value.trim();
            const rememberMe = document.getElementById('remember-me').checked;

            if (user === FIXED_TEACHER_USER && pass === FIXED_TEACHER_PASS) {
                if (rememberMe) {
                    localStorage.setItem('ncm309_remembered_user', user);
                    localStorage.setItem('ncm309_remembered_pass', pass);
                } else {
                    localStorage.removeItem('ncm309_remembered_user');
                    localStorage.removeItem('ncm309_remembered_pass');
                }

                sessionStorage.setItem('ncm309_teacher_logged', 'true');

                document.getElementById('teacher-login-modal').classList.add('hidden');
                document.getElementById('teacher-dashboard').classList.remove('hidden');
                loadTeacherData();
            } else {
                alert("帳號或密碼錯誤！請輸入正確的教師帳密 (t309 / 0909)。");
            }
        }

        function logoutTeacher() {
            sessionStorage.removeItem('ncm309_teacher_logged');
            location.reload();
        }

        function loadTeacherData() {
            const systemData = getSystemData();
            const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };
            
            document.getElementById('teacher-header-title').innerText = `${cInfo.className} • 教師溫馨後台`;
            document.getElementById('teacher-msg-label').innerText = `📢 ${cInfo.teacherName}老師提醒 / 給家長的話`;

            document.getElementById('setting-school').value = cInfo.schoolName;
            document.getElementById('setting-classname').value = cInfo.className;
            document.getElementById('setting-teacher').value = cInfo.teacherName;

            let activeNote = systemData.notesList[0] || null;

            document.getElementById('hw-current-date-tag').innerText = `目前檢視：${activeNote ? activeNote.date : '無'}`;

            const hwLines = activeNote && activeNote.content ? activeNote.content.split('\n').filter(line => line.trim() !== '') : [];
            const thead = document.getElementById('teacher-homework-thead');
            let theadHtml = `<th class="p-3">座號 / 姓名</th>`;
            if (hwLines.length === 0) {
                theadHtml += `<th class="p-3 text-slate-400">尚無作業項目</th>`;
            } else {
                hwLines.forEach(line => {
                    theadHtml += `<th class="p-3">${line}</th>`;
                });
            }
            theadHtml += `<th class="p-3 text-center">快捷操作</th>`;
            thead.innerHTML = theadHtml;

            const sortedIds = Object.keys(systemData.students).sort((a, b) => {
                return parseInt(systemData.students[a].seat) - parseInt(systemData.students[b].seat);
            });

            const tbody = document.getElementById('teacher-homework-tbody');
            const rosterTbody = document.getElementById('settings-student-tbody');
            const selectStudent = document.getElementById('inj-student-id');
            tbody.innerHTML = '';
            rosterTbody.innerHTML = '';
            selectStudent.innerHTML = '';

            sortedIds.forEach(id => {
                const student = systemData.students[id];
                selectStudent.innerHTML += `<option value="${id}">${student.seat} 號 - ${student.name} (學號: ${id})</option>`;

                let rowHtml = `<tr class="hover:bg-[#F0F7F6]"><td class="p-3 font-bold text-[#2F4F4F]">${student.seat} 號 - ${student.name} <span class="text-xs text-slate-400 font-medium">(${id})</span></td>`;

                if (hwLines.length === 0) {
                    rowHtml += `<td class="p-3 text-slate-400">-</td>`;
                } else {
                    if (!student.homeworkStatus) student.homeworkStatus = {};
                    if (!student.homeworkStatus[activeNote.id]) student.homeworkStatus[activeNote.id] = {};

                    hwLines.forEach((line, index) => {
                        const currentStatus = student.homeworkStatus[activeNote.id][index] || "1";
                        rowHtml += `
                            <td class="p-3">
                                <select onchange="updateHomework('${id}', '${activeNote.id}', ${index}, this.value)" class="px-3 py-2 rounded-xl border border-[#A3D2CA] bg-white text-sm font-bold text-[#2F4F4F] focus:ring-2 focus:ring-[#598379]">
                                    <option value="1" ${currentStatus === '1' ? 'selected' : ''}>1. 繳交</option>
                                    <option value="2" ${currentStatus === '2' ? 'selected' : ''}>2. 已補交</option>
                                    <option value="3" ${currentStatus === '3' ? 'selected' : ''}>3. 未完成</option>
                                    <option value="4" ${currentStatus === '4' ? 'selected' : ''}>4. 需訂正、補交</option>
                                    <option value="5" ${currentStatus === '5' ? 'selected' : ''}>5. 未帶回家</option>
                                    <option value="6" ${currentStatus === '6' ? 'selected' : ''}>6. 未帶到學校</option>
                                </select>
                            </td>
                        `;
                    });
                }

                rowHtml += `
                    <td class="p-3 text-center space-x-1 whitespace-nowrap">
                        <button onclick="setAllStatusForStudent('${id}', '${activeNote.id}', ${hwLines.length}, '1')" class="bg-emerald-600 hover:bg-emerald-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition">全部繳交</button>
                        <button onclick="setAllStatusForStudent('${id}', '${activeNote.id}', ${hwLines.length}, '3')" class="bg-amber-600 hover:bg-amber-700 text-white px-3 py-1.5 rounded-xl text-xs font-bold shadow-sm transition">全部未繳交</button>
                    </td>
                `;

                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;

                rosterTbody.innerHTML += `
                    <tr class="hover:bg-[#F0F7F6]">
                        <td class="p-3 font-bold text-[#2F4F4F]">${student.seat} 號</td>
                        <td class="p-3 font-medium text-slate-900">${student.name}</td>
                        <td class="p-3 text-[#598379] font-mono font-bold">${id}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteStudent('${id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 rounded-xl text-xs font-bold transition">刪除</button>
                        </td>
                    </tr>
                `;
            });

            loadTeacherNotesManager();

            const injuryStatusList = document.getElementById('teacher-injury-status-list');
            injuryStatusList.innerHTML = '';
            let hasInjury = false;

            sortedIds.forEach(id => {
                const student = systemData.students[id];
                if (student.injuries && student.injuries.length > 0) {
                    student.injuries.forEach((inj, injIndex) => {
                        hasInjury = true;
                        const isConfirmed = inj.confirmed === true;
                        injuryStatusList.innerHTML += `
                            <div class="p-4 rounded-2xl bg-[#F0F7F6] border border-[#A3D2CA] text-sm space-y-2 shadow-sm">
                                <div class="flex justify-between items-center font-bold">
                                    <span class="text-[#2F4F4F]">${student.seat} 號 - ${student.name}（${inj.date} ${inj.time}）</span>
                                    <span class="px-3 py-1 rounded-full font-bold text-xs ${isConfirmed ? 'bg-[#C8E6C9] text-[#1B5E20]' : 'bg-[#FFE082] text-[#5D4037]'}">
                                        <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                        ${isConfirmed ? '家長已確認收到 (' + inj.confirmTime + ')' : '尚未確認'}
                                    </span>
                                </div>
                                <p class="text-slate-800 font-medium">處理人員：${inj.nurse} | 地點：${inj.location} | 狀況：${inj.symptom}</p>
                                <p class="text-slate-800 bg-white p-3 rounded-xl border border-[#A3D2CA] font-medium">處置：${inj.treatment}</p>
                                <div class="flex justify-end gap-2 pt-1 border-t border-[#A3D2CA]">
                                    <button onclick="openInjuryEdit('${id}', ${injIndex})" class="bg-[#C8E6C9] hover:bg-[#A5D6A7] text-[#2F4F4F] px-3 py-1.5 rounded-xl font-bold transition text-xs"><i class="fa-solid fa-pen mr-1"></i> 修改</button>
                                    ${!isConfirmed ? `
                                        <button onclick="deleteInjury('${id}', ${injIndex})" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 rounded-xl font-bold transition text-xs"><i class="fa-solid fa-trash mr-1"></i> 刪除</button>
                                    ` : `
                                        <span class="text-slate-400 italic text-xs self-center font-medium">（家長已確認，無法刪除）</span>
                                    `}
                                </div>
                            </div>
                        `;
                    });
                }
            });

            if (!hasInjury) {
                injuryStatusList.innerHTML = `<p class="text-center text-xs text-[#598379] font-bold py-3">目前沒有發送任何傷病通知單</p>`;
            }
        }

        function openInjuryEdit(studentId, injIndex) {
            const systemData = getSystemData();
            const inj = systemData.students[studentId].injuries[injIndex];
            document.getElementById('edit-inj-student-id').value = studentId;
            document.getElementById('edit-inj-index').value = injIndex;
            document.getElementById('edit-inj-time').value = inj.time;
            document.getElementById('edit-inj-nurse').value = inj.nurse || "保健室";
            document.getElementById('edit-inj-location').value = inj.location;
            document.getElementById('edit-inj-symptom').value = inj.symptom;
            document.getElementById('edit-inj-treatment').value = inj.treatment;
            document.getElementById('injury-edit-modal').classList.remove('hidden');
        }

        function closeInjuryEditModal() {
            document.getElementById('injury-edit-modal').classList.add('hidden');
        }

        async function saveInjuryEdit() {
            const studentId = document.getElementById('edit-inj-student-id').value;
            const injIndex = parseInt(document.getElementById('edit-inj-index').value);

            const systemData = getSystemData();
            systemData.students[studentId].injuries[injIndex].time = document.getElementById('edit-inj-time').value;
            systemData.students[studentId].injuries[injIndex].nurse = document.getElementById('edit-inj-nurse').value;
            systemData.students[studentId].injuries[injIndex].location = document.getElementById('edit-inj-location').value;
            systemData.students[studentId].injuries[injIndex].symptom = document.getElementById('edit-inj-symptom').value;
            systemData.students[studentId].injuries[injIndex].treatment = document.getElementById('edit-inj-treatment').value;

            await saveSystemData(systemData);
            closeInjuryEditModal();
            alert("傷病通知單已成功修改更新！");
            loadTeacherData();
        }

        async function deleteInjury(studentId, injIndex) {
            const systemData = getSystemData();
            if (systemData.students[studentId].injuries[injIndex].confirmed) {
                alert("此筆傷病通知家長已經確認收到，無法刪除！");
                return;
            }
            if (confirm("確定要刪除這筆傷病通知紀錄嗎？")) {
                systemData.students[studentId].injuries.splice(injIndex, 1);
                await saveSystemData(systemData);
                alert("傷病通知紀錄已成功刪除！");
                loadTeacherData();
            }
        }

        async function setAllStatusForStudent(studentId, noteId, totalHwCount, targetStatus) {
            if (totalHwCount === 0) {
                alert("目前沒有作業項目可供設定！");
                return;
            }
            const systemData = getSystemData();
            if (!systemData.students[studentId].homeworkStatus) systemData.students[studentId].homeworkStatus = {};
            if (!systemData.students[studentId].homeworkStatus[noteId]) systemData.students[studentId].homeworkStatus[noteId] = {};

            for (let i = 0; i < totalHwCount; i++) {
                systemData.students[studentId].homeworkStatus[noteId][i] = targetStatus;
            }

            await saveSystemData(systemData);
            loadTeacherData();
        }

        function loadTeacherNotesManager() {
            const systemData = getSystemData();
            const listContainer = document.getElementById('teacher-history-notes-list');
            listContainer.innerHTML = '';

            systemData.notesList.forEach((note) => {
                const isActive = note.id === (systemData.notesList[0] ? systemData.notesList[0].id : '');
                listContainer.innerHTML += `
                    <div class="p-4 rounded-2xl ${isActive ? 'bg-[#D8E8E5] border-[#598379]' : 'bg-[#F0F7F6] border-[#A3D2CA]'} border text-sm space-y-2">
                        <div class="flex justify-between items-center font-bold ${isActive ? 'text-[#2F4F4F]' : 'text-slate-800'}">
                            <span>${isActive ? '📌 【當前顯示中】' : '📜'} 聯絡簿 (${note.date})</span>
                            <div class="flex gap-1.5">
                                <button onclick="editNote('${note.id}')" class="bg-[#598379] hover:bg-[#4A6B63] text-white px-3 py-1.5 rounded-xl text-xs shadow-sm transition font-bold">編輯</button>
                                <button onclick="deleteNote('${note.id}')" class="bg-rose-100 hover:bg-rose-200 text-rose-700 px-3 py-1.5 rounded-xl text-xs shadow-sm transition font-bold">刪除</button>
                            </div>
                        </div>
                        <p class="text-slate-800 whitespace-pre-line font-medium">${note.content}</p>
                    </div>
                `;
            });
        }

        async function deleteNote(id) {
            const systemData = getSystemData();
            if (systemData.notesList.length <= 1) {
                alert("至少需要保留一篇聯絡簿，無法全部刪除！");
                return;
            }

            if (confirm("確定要刪除這篇聯絡簿嗎？")) {
                systemData.notesList = systemData.notesList.filter(n => n.id !== id);
                await saveSystemData(systemData);
                alert("聯絡簿已成功刪除！");
                loadTeacherData();
            }
        }

        function editNote(id) {
            const systemData = getSystemData();
            const note = systemData.notesList.find(n => n.id === id);
            if (!note) return;

            document.getElementById('note-date').value = note.date;
            document.getElementById('note-content').value = note.content;
            document.getElementById('note-parent-message').value = note.parentMessage || "";
            document.getElementById('note-parent-assist').value = note.parentAssist || "";
            document.getElementById('note-reminder').value = note.reminder || "";
        }

        function prepareNewNote() {
            document.getElementById('note-date').value = getTaiwanTaipeiDateString();
            document.getElementById('note-content').value = "";
            document.getElementById('note-parent-message').value = "";
            document.getElementById('note-parent-assist').value = "";
            document.getElementById('note-reminder').value = "";
            alert("已準備好發布新的一天聯絡簿！系統已自動帶入正確的台北標準日期與星期。");
        }

        async function updateHomework(studentId, noteId, hwIndex, newStatus) {
            const systemData = getSystemData();
            if (!systemData.students[studentId].homeworkStatus) systemData.students[studentId].homeworkStatus = {};
            if (!systemData.students[studentId].homeworkStatus[noteId]) systemData.students[studentId].homeworkStatus[noteId] = {};
            systemData.students[studentId].homeworkStatus[noteId][hwIndex] = newStatus;
            await saveSystemData(systemData);
        }

        async function saveContactNote() {
            const systemData = getSystemData();
            const contentVal = document.getElementById('note-content').value.trim();
            const rawDateVal = document.getElementById('note-date').value.trim();

            if (!contentVal) {
                alert("聯絡簿抄寫內容不得為空白，避免資料被清空！");
                return;
            }

            const correctedDateStr = parseAndCorrectDateString(rawDateVal);

            const updatedNoteData = {
                id: new Date().toISOString(), // 每次儲存或新增都以最新時間戳記排在最前面
                date: correctedDateStr,
                content: contentVal,
                parentMessage: document.getElementById('note-parent-message').value,
                parentAssist: document.getElementById('note-parent-assist').value,
                reminder: document.getElementById('note-reminder').value
            };

            // 將新聯絡簿推到最前面，並保留過去所有的歷史聯絡簿不被覆蓋
            systemData.notesList.unshift(updatedNoteData);
            
            await saveSystemData(systemData);
            alert(`聯絡簿已成功儲存與雲端同步！歷史紀錄已完整保留。`);
            loadTeacherData();
        }

        async function addNewStudent() {
            const seat = document.getElementById('new-seat').value.trim();
            const name = document.getElementById('new-name').value.trim();
            const id = document.getElementById('new-id').value.trim();

            if (!seat || !name || !id) {
                alert("請完整填寫座號、姓名與學號！");
                return;
            }

            const systemData = getSystemData();
            systemData.students[id] = { name: name, seat: seat, homeworkStatus: {}, injuries: [] };

            await saveSystemData(systemData);
            alert(`已成功新增/更新學生：${seat} 號 ${name}！`);
            document.getElementById('new-seat').value = '';
            document.getElementById('new-name').value = '';
            document.getElementById('new-id').value = '';
            loadTeacherData();
        }

        async function deleteStudent(id) {
            if (confirm("確定要刪除這位學生嗎？")) {
                const systemData = getSystemData();
                delete systemData.students[id];
                await saveSystemData(systemData);
                loadTeacherData();
            }
        }

        async function saveClassSettings() {
            const systemData = getSystemData();
            systemData.classInfo = {
                schoolName: document.getElementById('setting-school').value.trim(),
                className: document.getElementById('setting-classname').value.trim(),
                teacherName: document.getElementById('setting-teacher').value.trim()
            };
            await saveSystemData(systemData);
            alert("班級基本設定已成功儲存！");
            loadTeacherData();
        }

        async function submitInjuryNotice(event) {
            event.preventDefault();
            const studentId = document.getElementById('inj-student-id').value;
            const newInjury = {
                date: getTaiwanTaipeiDateString(),
                time: document.getElementById('inj-time').value,
                nurse: document.getElementById('inj-nurse').value,
                location: document.getElementById('inj-location').value,
                symptom: document.getElementById('inj-symptom').value,
                treatment: document.getElementById('inj-treatment').value,
                confirmed: false,
                confirmTime: null
            };

            const systemData = getSystemData();
            if (!systemData.students[studentId].injuries) systemData.students[studentId].injuries = [];
            systemData.students[studentId].injuries.unshift(newInjury);
            await saveSystemData(systemData);
            alert("傷病通知單已成功發送！");
            loadTeacherData();
        }

        function switchTab(tab) {
            document.getElementById('tab-hw').className = tab === 'homework' ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition whitespace-nowrap px-4" : "flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4";
            document.getElementById('tab-note').className = tab === 'note' ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition whitespace-nowrap px-4" : "flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4";
            document.getElementById('tab-inj').className = tab === 'injury' ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition whitespace-nowrap px-4" : "flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4";
            document.getElementById('tab-set').className = tab === 'settings' ? "flex-1 py-2.5 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition whitespace-nowrap px-4" : "flex-1 py-2.5 text-xs font-bold rounded-xl text-[#598379] transition whitespace-nowrap px-4";

            document.getElementById('section-homework').classList.toggle('hidden', tab !== 'homework');
            document.getElementById('section-note').classList.toggle('hidden', tab !== 'note');
            document.getElementById('section-injury').classList.toggle('hidden', tab !== 'injury');
            document.getElementById('section-settings').classList.toggle('hidden', tab !== 'settings');
        }
    </script>
