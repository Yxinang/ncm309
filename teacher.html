<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>309 班級 - 教師與保健室管理後台</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-100 font-sans text-slate-800 flex flex-col min-h-screen">

    <header class="bg-slate-900 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg">
                    <i class="fa-solid fa-chalkboard-user text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base">三年九班 • 教師管理後台</h1>
                    <p class="text-xs text-slate-400">作業點收、聯絡簿與傷病通報系統</p>
                </div>
            </div>
            <span class="text-xs bg-emerald-500/20 text-emerald-400 px-2.5 py-1 rounded-full font-medium border border-emerald-500/30">
                <i class="fa-solid fa-circle text-[8px] mr-1"></i> 系統連線中
            </span>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 功能分頁切換 -->
        <div class="flex bg-slate-200 p-1 rounded-xl max-w-lg mx-auto">
            <button onclick="switchTab('homework')" id="tab-hw" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition">
                <i class="fa-solid fa-book-open mr-1"></i> 作業點收
            </button>
            <button onclick="switchTab('note')" id="tab-note" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">
                <i class="fa-solid fa-pen-nib mr-1"></i> 聯絡簿內容
            </button>
            <button onclick="switchTab('injury')" id="tab-inj" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">
                <i class="fa-solid fa-notes-medical mr-1"></i> 傷病通知
            </button>
        </div>

        <!-- 【分頁一：作業繳交管理】 -->
        <div id="section-homework" class="space-y-4">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4">
                <div class="flex justify-between items-center border-b pb-3">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-list-check text-indigo-600"></i> 全班作業點收表
                    </h2>
                    <span class="text-xs text-slate-500">點擊勾選即可即時更新學生端狀態</span>
                </div>
                <div class="overflow-x-auto">
                    <table class="w-full text-left border-collapse text-xs">
                        <thead>
                            <tr class="bg-slate-50 text-slate-600 border-b">
                                <th class="p-3">座號 / 姓名</th>
                                <th class="p-3">國文習作第 4 課</th>
                                <th class="p-3">數學隨堂練習卷</th>
                                <th class="p-3">社會課本預習</th>
                            </tr>
                        </thead>
                        <tbody id="teacher-homework-tbody" class="divide-y divide-slate-100"></tbody>
                    </table>
                </div>
            </div>
        </div>

        <!-- 【分頁二：當日聯絡簿抄寫內容設定】 -->
        <div id="section-note" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 max-w-lg mx-auto">
                <div class="border-b pb-3">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-book text-indigo-600"></i> 發布今日聯絡簿抄寫內容
                    </h2>
                    <p class="text-xs text-slate-500 mt-0.5">編輯今天的聯絡簿事項，讓家長開啟手機即可對照抄寫</p>
                </div>

                <div class="space-y-3 text-xs">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">今日日期</label>
                        <input type="text" id="note-date" value="2026 年 11 月 2 日 (星期一)" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">聯絡簿抄寫內容 / 功課清單 *</label>
                        <textarea id="note-content" rows="6" class="w-full px-3 py-2 rounded-lg border border-slate-300 font-mono text-xs" placeholder="1. 國習 P.20-22&#10;2. 數習 P.15&#10;3. 帶水彩與圖畫紙&#10;4. 明天英語小考">1. 國文習作第 4 課完成
2. 數學隨堂練習卷訂正
3. 社會課本預習單
4. 明天記得帶健保卡（預防針注射）</textarea>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">老師叮嚀 / 備註事項</label>
                        <input type="text" id="note-reminder" value="近期早晚溫差大，請提醒孩子多帶一件外套。" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                    </div>

                    <button onclick="saveContactNote()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-2.5 rounded-xl shadow transition mt-2">
                        <i class="fa-solid fa-floppy-disk mr-1"></i> 儲存並同步至家長端
                    </button>
                </div>
            </div>
        </div>

        <!-- 【分頁三：發送傷病通知單】 -->
        <div id="section-injury" class="space-y-4 hidden">
            <div class="bg-white rounded-2xl p-5 shadow-sm border border-slate-200 space-y-4 max-w-lg mx-auto">
                <div class="border-b pb-3">
                    <h2 class="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <i class="fa-solid fa-user-nurse text-rose-600"></i> 保健室發送傷病通知單
                    </h2>
                </div>
                <form onsubmit="submitInjuryNotice(event)" class="space-y-3 text-xs">
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">選擇學生 *</label>
                        <select id="inj-student-id" required class="w-full px-3 py-2 rounded-lg border border-slate-300">
                            <option value="30901">30901 - 王小明</option>
                            <option value="30902">30902 - 李小華</option>
                        </select>
                    </div>
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">發生時間 *</label>
                            <input type="text" id="inj-time" required value="上午 10:15" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                        </div>
                        <div>
                            <label class="block font-medium text-slate-700 mb-1">發生地點 *</label>
                            <input type="text" id="inj-location" required value="下課遊樂場" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                        </div>
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">受傷症狀與部位 *</label>
                        <input type="text" id="inj-symptom" required value="右膝擦傷（輕微紅腫）" class="w-full px-3 py-2 rounded-lg border border-slate-300">
                    </div>
                    <div>
                        <label class="block font-medium text-slate-700 mb-1">處理經過與處置 *</label>
                        <textarea id="inj-treatment" rows="3" required class="w-full px-3 py-2 rounded-lg border border-slate-300">生理食鹽水清洗傷口，擦優碘並貼人工皮。</textarea>
                    </div>
                    <button type="submit" class="w-full bg-rose-600 hover:bg-rose-700 text-white font-bold py-2.5 rounded-xl shadow transition mt-2">
                        發送傷病通知單
                    </button>
                </form>
            </div>
        </div>

    </main>

    <footer class="py-4 text-center text-xs text-slate-500 bg-white border-t mt-auto">
        <p>校園後台管理系統 • 授權教師與護理師專用</p>
    </footer>

    <script>
        // 模擬全域資料 (可用 localStorage 讓家長端同步讀取)
        const sharedData = {
            "30901": {
                name: "王小明", seat: "01",
                homework: [
                    { name: "國文習作第 4 課", status: "submitted" },
                    { name: "數學隨堂練習卷", status: "submitted" },
                    { name: "社會課本預習", status: "pending" }
                ],
                injuries: []
            },
            "30902": {
                name: "李小華", seat: "02",
                homework: [
                    { name: "國文習作第 4 課", status: "submitted" },
                    { name: "數學隨堂練習卷", status: "pending" },
                    { name: "社會課本預習", status: "pending" }
                ],
                injuries: []
            },
            contactNote: {
                date: "2026 年 11 月 2 日 (星期一)",
                content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷訂正\n3. 社會課本預習單\n4. 明天記得帶健保卡（預防針注射）",
                reminder: "近期早晚溫差大，請提醒孩子多帶一件外套。"
            }
        };

        // 載入時存入 localStorage 供家長端讀取
        function syncToLocalStorage() {
            localStorage.setItem('schoolSystemData', JSON.stringify(sharedData));
        }

        function renderTeacherTable() {
            const tbody = document.getElementById('teacher-homework-tbody');
            tbody.innerHTML = '';
            Object.keys(sharedData).forEach(id => {
                if (id === 'contactNote') return;
                const student = sharedData[id];
                let rowHtml = `<tr class="hover:bg-slate-50"><td class="p-3 font-bold text-slate-700">${student.seat} - ${student.name}</td>`;
                student.homework.forEach((hw, index) => {
                    const isChecked = hw.status === 'submitted';
                    rowHtml += `
                        <td class="p-3">
                            <label class="inline-flex items-center cursor-pointer gap-2">
                                <input type="checkbox" ${isChecked ? 'checked' : ''} onchange="toggleHomework('${id}', ${index}, this.checked)" class="w-4 h-4 text-indigo-600 rounded border-slate-300">
                                <span class="${isChecked ? 'text-emerald-600 font-medium' : 'text-slate-400'}">${isChecked ? '已交' : '未交'}</span>
                            </label>
                        </td>
                    `;
                });
                rowHtml += `</tr>`;
                tbody.innerHTML += rowHtml;
            });
            syncToLocalStorage();
        }

        function toggleHomework(studentId, hwIndex, isChecked) {
            sharedData[studentId].homework[hwIndex].status = isChecked ? 'submitted' : 'pending';
            syncToLocalStorage();
        }

        function saveContactNote() {
            sharedData.contactNote.date = document.getElementById('note-date').value;
            sharedData.contactNote.content = document.getElementById('note-content').value;
            sharedData.contactNote.reminder = document.getElementById('note-reminder').value;
            syncToLocalStorage();
            alert("聯絡簿內容已成功儲存並同步至所有家長端！");
        }

        function submitInjuryNotice(event) {
            event.preventDefault();
            const studentId = document.getElementById('inj-student-id').value;
            const newInjury = {
                date: "2026-11-02",
                time: document.getElementById('inj-time').value,
                location: document.getElementById('inj-location').value,
                symptom: document.getElementById('inj-symptom').value,
                treatment: document.getElementById('inj-treatment').value,
                nurse: "張護理師"
            };
            sharedData[studentId].injuries.push(newInjury);
            syncToLocalStorage();
            alert(`已成功發送傷病通知單給 ${sharedData[studentId].name} 的家長！`);
        }

        function switchTab(tab) {
            document.getElementById('tab-hw').className = tab === 'homework' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
            document.getElementById('tab-note').className = tab === 'note' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
            document.getElementById('tab-inj').className = tab === 'injury' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";

            document.getElementById('section-homework').classList.toggle('hidden', tab !== 'homework');
            document.getElementById('section-note').classList.toggle('hidden', tab !== 'note');
            document.getElementById('section-injury').classList.toggle('hidden', tab !== 'injury');
        }

        window.onload = renderTeacherTable;
    </script>
</body>
</html>
