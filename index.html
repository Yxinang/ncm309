<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>309 班級 - 家長即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <!-- 頂部導覽列 (登入後顯示) -->
    <header id="app-header" class="bg-indigo-600 text-white shadow-md sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-full">
                    <i class="fa-solid fa-child-reaching text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base" id="header-child-name">載入中...</h1>
                    <p class="text-xs text-indigo-200" id="header-child-info">三年九班</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-white bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition flex items-center gap-1 shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-md mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 區塊一：學號登入畫面 (預設顯示) -->
        <section id="login-section" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-6 my-auto">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-school"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">歡迎來到 309 班級</h2>
                <p class="text-xs text-slate-500">請輸入您孩子的**學號**以查看即時作業與傷病紀錄</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">學生學號</label>
                    <div class="relative">
                        <span class="absolute inset-y-0 left-0 flex items-center pl-3 text-slate-400">
                            <i class="fa-solid fa-id-badge"></i>
                        </span>
                        <input type="text" id="login-student-id" required placeholder="例如：30901" class="w-full pl-10 pr-3 py-2.5 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm">
                    </div>
                </div>

                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow-md transition flex items-center justify-center gap-2 text-sm">
                    <i class="fa-solid fa-arrow-right-to-bracket"></i> 進入孩子專區
                </button>
            </form>

            <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 text-xs text-slate-500 space-y-1">
                <p class="font-bold text-slate-600">💡 測試用學號提示：</p>
                <p>• 輸入 <span class="text-indigo-600 font-mono font-bold">30901</span> (王小明)</p>
            </div>
        </section>

        <!-- 區塊二：家長主控台儀表板 (登入後顯示) -->
        <div id="dashboard-section" class="hidden space-y-6">
            
            <!-- 頁籤切換：今日即時 vs 所有紀錄 -->
            <div class="flex bg-slate-200 p-1 rounded-xl">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition">
                    <i class="fa-solid fa-bolt mr-1"></i> 今日即時概況
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> 所有歷史紀錄
                </button>
            </div>

            <!-- 【頁籤一：今日即時概況】 -->
            <div id="view-today" class="space-y-6">
                <!-- 狀態摘要 -->
                <div class="bg-gradient-to-r from-indigo-500 to-violet-600 rounded-2xl p-5 text-white shadow-lg">
                    <div class="flex justify-between items-center mb-3">
                        <span class="text-xs font-medium bg-white/20 px-3 py-1 rounded-full">今日概況</span>
                        <span class="text-xs text-indigo-100">2026-11-02 週一</span>
                    </div>
                    <div class="grid grid-cols-2 gap-4 text-center">
                        <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm">
                            <p class="text-2xl font-bold" id="today-homework-summary">0 / 0</p>
                            <p class="text-xs text-indigo-200 mt-1">作業已繳交</p>
                        </div>
                        <div class="bg-white/10 p-3 rounded-xl backdrop-blur-sm">
                            <p class="text-2xl font-bold text-amber-300" id="today-injury-count">0</p>
                            <p class="text-xs text-indigo-200 mt-1">今日傷病通知</p>
                        </div>
                    </div>
                </div>

                <!-- 今日作業 -->
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-book-open text-indigo-500"></i> 今日作業繳交
                        </h2>
                        <span class="text-xs text-slate-400">即時更新</span>
                    </div>
                    <div class="space-y-3" id="today-homework-list"></div>
                </section>

                <!-- 今日傷病通知 -->
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-notes-medical text-rose-500"></i> 今日傷病通知單
                        </h2>
                        <span class="text-xs text-slate-400">保健室</span>
                    </div>
                    <div class="space-y-3" id="today-injury-list"></div>
                </section>
            </div>

            <!-- 【頁籤二：所有歷史紀錄】 -->
            <div id="view-history" class="space-y-6 hidden">
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-4">
                    <div class="flex justify-between items-center border-b pb-3">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-box-archive text-indigo-500"></i> 過往傷病與通知總覽
                        </h2>
                        <span class="text-xs text-slate-400">完整歷史</span>
                    </div>
                    <div class="space-y-3" id="all-history-list">
                        <!-- 動態載入所有歷史紀錄 -->
                    </div>
                </section>
            </div>

        </div>

    </main>

    <!-- 底部資訊 -->
    <footer class="py-3 text-center text-xs text-slate-400">
        <p>校園即時照護系統 • 隨時守護孩子安全</p>
    </footer>

    <!-- JavaScript 邏輯 -->
    <script>
        const database = {
            "30901": {
                name: "王小明",
                seat: "01",
                className: "三年九班",
                todayHomework: [
                    { name: "國文習作第 4 課", status: "submitted", time: "上午 08:15" },
                    { name: "數學隨堂練習卷", status: "submitted", time: "上午 09:30" },
                    { name: "社會課本預習", status: "pending", time: null }
                ],
                todayInjuries: [
                    {
                        time: "上午 10:15",
                        location: "下課遊樂場",
                        symptom: "右膝擦傷（輕微紅腫）",
                        treatment: "生理食鹽水清洗傷口，擦優碘並貼人工皮。",
                        nurse: "張護理師"
                    }
                ],
                allHistory: [
                    { date: "2026-11-01", type: "傷病通知", content: "右手指輕微扭傷，已冰敷處理。" },
                    { date: "2026-10-28", type: "傷病通知", content: "午休後頭暈，保健室休息 20 分鐘後恢復。" },
                    { date: "2026-10-25", type: "作業未交提醒", content: "英文單字本逾期未交，當日已補交。" }
                ]
            }
        };

        let currentStudent = null;

        function handleLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('login-student-id').value.trim();

            if (database[studentId]) {
                currentStudent = database[studentId];
                
                document.getElementById('header-child-name').innerText = currentStudent.name;
                document.getElementById('header-child-info').innerText = `${currentStudent.className} • 座號 ${currentStudent.seat} 號`;
                
                renderDashboard();

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                alert("找不到此學號，請輸入測試學號：30901");
            }
        }

        function renderDashboard() {
            // 1. 今日作業渲染
            const hwContainer = document.getElementById('today-homework-list');
            hwContainer.innerHTML = '';
            let submittedCount = 0;

            currentStudent.todayHomework.forEach(hw => {
                if (hw.status === 'submitted') submittedCount++;
                const isDone = hw.status === 'submitted';
                hwContainer.innerHTML += `
                    <div class="flex items-center justify-between p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                        <div class="flex items-center space-x-3">
                            <div class="w-7 h-7 rounded-full flex items-center justify-center ${isDone ? 'bg-emerald-100 text-emerald-600' : 'bg-amber-100 text-amber-600'}">
                                <i class="fa-solid ${isDone ? 'fa-check' : 'fa-clock'}"></i>
                            </div>
                            <div>
                                <p class="font-medium text-slate-800">${hw.name}</p>
                                <p class="text-[10px] text-slate-400">${isDone ? '繳交時間: ' + hw.time : '尚未繳交'}</p>
                            </div>
                        </div>
                        <span class="px-2.5 py-1 rounded-full font-medium ${isDone ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                            ${isDone ? '已繳交' : '未繳交'}
                        </span>
                    </div>
                `;
            });
            document.getElementById('today-homework-summary').innerText = `${submittedCount} / ${currentStudent.todayHomework.length}`;

            // 2. 今日傷病渲染
            const injuryContainer = document.getElementById('today-injury-list');
            injuryContainer.innerHTML = '';
            
            if (currentStudent.todayInjuries.length === 0) {
                injuryContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">今日無傷病通知紀錄 🎉</p>`;
                document.getElementById('today-injury-count').innerText = "0";
            } else {
                document.getElementById('today-injury-count').innerText = currentStudent.todayInjuries.length;
                currentStudent.todayInjuries.forEach(inj => {
                    injuryContainer.innerHTML += `
                        <div class="p-3.5 rounded-xl bg-rose-50/50 border border-rose-100 space-y-2 text-xs">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-rose-600 bg-rose-100 px-2 py-0.5 rounded-full">${inj.time}</span>
                                <span class="text-slate-500">處理護理師：${inj.nurse}</span>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">狀況：${inj.symptom}</p>
                                <p class="text-slate-600 mt-0.5">地點：${inj.location}</p>
                            </div>
                            <div class="bg-white p-2.5 rounded-lg border border-rose-100 text-slate-700 space-y-0.5">
                                <p class="font-semibold text-rose-700">處理經過：</p>
                                <p>${inj.treatment}</p>
                            </div>
                        </div>
                    `;
                });
            }

            // 3. 所有歷史紀錄渲染
            const historyContainer = document.getElementById('all-history-list');
            historyContainer.innerHTML = '';
            currentStudent.allHistory.forEach(item => {
                historyContainer.innerHTML += `
                    <div class="p-3 rounded-xl bg-slate-50 border border-slate-100 text-xs space-y-1">
                        <div class="flex justify-between items-center">
                            <span class="font-bold text-indigo-600">${item.date}</span>
                            <span class="bg-slate-200 text-slate-700 px-2 py-0.5 rounded text-[10px]">${item.type}</span>
                        </div>
                        <p class="text-slate-700">${item.content}</p>
                    </div>
                `;
            });
        }

        function switchTab(tab) {
            const btnToday = document.getElementById('tab-today');
            const btnHistory = document.getElementById('tab-history');
            const viewToday = document.getElementById('view-today');
            const viewHistory = document.getElementById('view-history');

            if (tab === 'today') {
                btnToday.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                btnHistory.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
                viewToday.classList.remove('hidden');
                viewHistory.classList.add('hidden');
            } else {
                btnHistory.className = "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition";
                btnToday.className = "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
                viewHistory.classList.remove('hidden');
                viewToday.classList.add('hidden');
            }
        }

        function logout() {
            currentStudent = null;
            document.getElementById('login-student-id').value = '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
