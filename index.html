<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>海洋生物樂園 - 親師生即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { 
            background-color: #33FFCC; 
            font-family: system-ui, -apple-system, sans-serif; 
            color: #1a4d43; 
        }
        .crayon-card {
            background: #ffffff;
            border: 3px solid #1a4d43;
            border-radius: 2rem;
            box-shadow: 4px 4px 0px #1a4d43;
        }
        .ocean-header {
            background: linear-gradient(135deg, #20b2aa, #008b8b);
            border-bottom: 4px solid #1a4d43;
        }
    </style>
</head>
<body class="flex flex-col min-h-screen text-base">

    <header id="app-header" class="ocean-header text-white shadow-md sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/80 p-2.5 rounded-2xl text-teal-800 shadow-sm border-2 border-teal-900">
                    <i class="fa-solid fa-fish text-xl"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base" id="header-child-name">載入中...</h1>
                    <p class="text-xs text-teal-100 font-semibold" id="header-className-display">班級載入中...</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-teal-900 bg-amber-200 hover:bg-amber-300 px-3.5 py-2 rounded-xl transition flex items-center gap-1 font-bold shadow-sm border border-teal-900">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 登入畫面 -->
        <section id="login-section" class="crayon-card p-6 space-y-6 my-auto bg-white/95">
            <div class="text-center space-y-2">
                <div class="w-20 h-20 bg-teal-100 text-teal-700 rounded-3xl flex items-center justify-center mx-auto text-3xl shadow-inner border-2 border-teal-900">
                    <i class="fa-solid fa-water font-bold"></i>
                </div>
                <h2 class="text-2xl font-extrabold text-teal-900" id="login-title-display">海洋生物樂園 🐳</h2>
                <p class="text-sm font-semibold text-teal-700">請輸入學生學號，展開奇幻的深海學習之旅 ✨</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block font-extrabold text-teal-900 mb-1">學生學號</label>
                    <input type="text" id="login-student-id" required placeholder="請輸入學生學號" class="w-full px-4 py-3 rounded-2xl border-2 border-teal-900 bg-teal-50/50 text-base focus:ring-2 focus:ring-teal-400 outline-none font-bold">
                </div>
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="parent-remember-me" class="w-5 h-5 text-teal-600 rounded border-2 border-teal-900">
                    <label for="parent-remember-me" class="ml-2 text-teal-900 font-bold text-sm">記住我 (下次自動登入)</label>
                </div>
                <button type="submit" class="w-full bg-amber-400 hover:bg-amber-500 text-teal-950 font-extrabold py-3.5 rounded-2xl shadow-md transition text-base border-2 border-teal-900">
                    進入海洋小天地 🐢
                </button>
            </form>

            <div class="pt-4 border-t-2 border-teal-100 flex justify-between items-center text-xs font-bold text-teal-800">
                <span id="login-footer-school">崇明國小</span>
                <a href="teacher.html" class="text-teal-900 hover:underline"><i class="fa-solid fa-lock mr-1"></i>教師後台</a>
            </div>
        </section>

        <!-- 儀表板主畫面 -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex bg-white p-1.5 rounded-2xl border-2 border-teal-900 shadow-sm">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2.5 text-xs font-extrabold rounded-xl bg-teal-600 text-white shadow-sm transition">
                    <i class="fa-solid fa-compass mr-1"></i> 每日聯絡簿與作業
                </button>
                <button onclick="switchTab('injury')" id="tab-injury" class="flex-1 py-2.5 text-xs font-extrabold rounded-lg text-teal-900 transition">
                    <i class="fa-solid fa-shield-heart mr-1"></i> 傷病護理紀錄
                </button>
            </div>

            <!-- 第一頁：聯絡簿與作業 -->
            <div id="view-today" class="space-y-6">
                
                <!-- 當天聯絡簿內容與老師提醒 -->
                <section class="crayon-card p-5 space-y-3 bg-gradient-to-br from-teal-50 to-emerald-50">
                    <div class="flex justify-between items-center border-b-2 border-teal-900 pb-2">
                        <h2 class="font-extrabold text-teal-900 text-base flex items-center gap-2">
                            <i class="fa-solid fa-star text-amber-500"></i> 當天聯絡簿內容
                        </h2>
                        <span class="text-xs font-bold text-teal-900 bg-amber-200 px-3 py-1 rounded-full border border-teal-900" id="note-display-date">載入中...</span>
                    </div>
                    <div class="bg-white p-4 rounded-2xl border-2 border-teal-900 shadow-sm">
                        <p class="text-sm text-teal-950 whitespace-pre-line font-bold leading-relaxed" id="note-display-content">載入中...</p>
                    </div>
                    
                    <div class="bg-amber-50 p-4 rounded-2xl border-2 border-amber-300 space-y-1">
                        <p class="text-xs font-extrabold text-amber-950 flex items-center gap-1" id="note-teacher-label">
                            <i class="fa-solid fa-heart text-rose-500"></i> 老師提醒 / 給家長的話：
                        </p>
                        <p class="text-sm text-amber-950 font-bold leading-relaxed pl-4" id="note-display-message">尚無留言</p>
                    </div>

                    <div class="flex items-center gap-2 text-xs font-bold text-teal-900 bg-white p-3 rounded-2xl border-2 border-teal-900">
                        <i class="fa-solid fa-bell text-teal-600 text-base"></i>
                        <p><span class="font-extrabold">叮嚀備註：</span><span id="note-display-reminder">載入中...</span></p>
                    </div>
                </section>

                <!-- 昨天聯絡簿內容 -->
                <section class="crayon-card p-5 space-y-3">
                    <h2 class="font-extrabold text-teal-900 text-base flex items-center gap-2 border-b-2 border-teal-900 pb-2">
                        <i class="fa-solid fa-clock-rotate-left text-teal-600"></i> 昨天聯絡簿內容
                    </h2>
                    <div class="bg-teal-50/60 p-4 rounded-2xl border-2 border-teal-900" id="yesterday-note-content">
                        <p class="text-xs font-bold text-teal-800 text-center py-2">昨日無上一個聯絡簿紀錄</p>
                    </div>
                </section>

                <!-- 昨天作業今天繳交狀態 -->
                <section class="crayon-card p-5 space-y-3">
                    <h2 class="font-extrabold text-teal-900 text-base flex items-center gap-2 border-b-2 border-teal-900 pb-2">
                        <i class="fa-solid fa-list-check text-teal-600"></i> 昨天作業今天到校繳交狀態
                    </h2>
                    <div class="space-y-2.5" id="yesterday-homework-list">
                        <p class="text-xs font-bold text-teal-800 text-center py-2">昨日無登記作業狀態</p>
                    </div>
                </section>

                <!-- 需家長協助完成之作業 -->
                <section class="crayon-card p-5 space-y-3 bg-gradient-to-br from-orange-50 to-amber-50 border-orange-900">
                    <h2 class="font-extrabold text-orange-950 text-base flex items-center gap-2 border-b-2 border-orange-900 pb-2">
                        <i class="fa-solid fa-hands-holding-child text-orange-600"></i> 需家長協助完成之作業 / 親子共學
                    </h2>
                    <div class="bg-white p-4 rounded-2xl border-2 border-orange-900 text-xs space-y-2" id="parent-assist-homework-list">
                        <p class="text-slate-600 font-bold text-center py-1">目前無特別需家長協助之項目 ✨</p>
                    </div>
                </section>

            </div>

            <!-- 第二頁：傷病通知紀錄 -->
            <div id="view-injury" class="space-y-6 hidden">
                <section class="crayon-card p-5 space-y-4">
                    <h2 class="font-extrabold text-teal-900 text-base flex items-center gap-2 border-b-2 border-teal-900 pb-2">
                        <i class="fa-solid fa-clock text-amber-500"></i> 老師上傳，等待家長確認（<span id="pending-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-3" id="pending-injury-list"></div>
                </section>

                <section class="crayon-card p-5 space-y-4 border-emerald-900">
                    <h2 class="font-extrabold text-emerald-950 text-base flex items-center gap-2 border-b-2 border-emerald-900 pb-2">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i> 家長已確認收到紀錄（<span id="confirmed-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-3" id="confirmed-injury-list"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs font-bold text-teal-950 bg-teal-400/50 border-t-2 border-teal-900 mt-auto">
        <p id="footer-school-name">崇明國小 • 海洋生物樂園守護每一刻 🐬</p>
    </footer>

    <script>
        const CLOUD_BIN_URL = 'https://api.jsonbin.io/v3/b/65f6c82d3dcbb1b7cc342831';

        window.onload = async function() {
            await syncLoadData();
            const systemData = getSystemData();
            if (systemData.classInfo) {
                document.getElementById('login-title-display').innerText = `${systemData.classInfo.className} 海洋樂園 🐳`;
                document.getElementById('login-footer-school').innerText = systemData.classInfo.schoolName;
                document.getElementById('footer-school-name').innerText = `${systemData.classInfo.schoolName} • 海洋生物樂園守護每一刻 🐬`;
            }

            const rememberedId = localStorage.getItem('ncm309_remembered_parent_id');
            if (rememberedId && systemData.students[rememberedId]) {
                document.getElementById('login-student-id').value = rememberedId;
                document.getElementById('parent-remember-me').checked = true;
                autoLoginParent(rememberedId, systemData);
            }

            setInterval(async () => {
                await syncLoadData();
                if (currentStudentId) {
                    const latestData = getSystemData();
                    if (latestData.students[currentStudentId]) {
                        renderDashboard(latestData.students[currentStudentId], latestData);
                    }
                }
            }, 10000);
        };

        async function syncLoadData() {
            try {
                const response = await fetch(`${CLOUD_BIN_URL}/latest`, {
                    headers: { 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' }
                });
                if (response.ok) {
                    const cloudResult = await response.json();
                    if (cloudResult && cloudResult.record) {
                        if (cloudResult.record.notesList && Array.isArray(cloudResult.record.notesList)) {
                            cloudResult.record.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
                        }
                        localStorage.setItem('ncm309_school_data', JSON.stringify(cloudResult.record));
                    }
                }
            } catch (e) {
                console.log("使用本地快取資料");
            }
        }

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                localStorage.setItem('ncm309_school_data', JSON.stringify(freshData));
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList || parsed.notesList.length === 0) {
                    parsed.notesList = freshData.notesList;
                } else {
                    parsed.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
                }
                if (!parsed.activeNoteId) parsed.activeNoteId = parsed.notesList[0].id;
                if (!parsed.students || Object.keys(parsed.students).length < 25) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function getTaiwanTaipeiDateString() {
            const now = new Date();
            const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long' };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            const parts = formatter.formatToParts(now);
            
            let year = '', month = '', day = '', weekday = '';
            parts.forEach(part => {
                if (part.type === 'year') year = parseInt(part.value) - 1911;
                if (part.type === 'month') month = part.value;
                if (part.type === 'day') day = part.value;
                if (part.type === 'weekday') weekday = part.value;
            });
            return `民國 ${year} 年 ${month} 月 ${day} 日 (${weekday})`;
        }

        function generateDefaultData() {
            const names = ["黃琨翔", "陳秉軒", "杜晨翔", "劉景碩", "王宇童", "吳立翔", "陳宇恩", "林楷諾", "李柏衡", "林晉翰", "徐堉綸", "紀孟希", "徐晟瀚", "王知言", "蔡佩穎", "鄭詠心", "郭聿芸", "楊茲甯", "王岑芝", "吳涵儒", "洪楀晴", "林芷萱", "潘若穎", "焉語霓", "蘇唯心"];
            const ids = ["113056", "113058", "113164", "113166", "113245", "113140", "113248", "113010", "113037", "113279", "113123", "113200", "113015", "113017", "113151", "113284", "113178", "113204", "113021", "113205", "113232", "113208", "113129", "113134", "113212"];
            let students = {};
            ids.forEach((id, index) => {
                students[id] = { name: names[index], seat: String(index + 1), homeworkStatus: {}, injuries: [] };
            });
            students["123"] = { name: "測試帳號", seat: "30", homeworkStatus: {}, injuries: [] };

            const defaultId = new Date().toISOString();
            const defaultNotesList = [{
                id: defaultId,
                date: getTaiwanTaipeiDateString(),
                content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷",
                parentMessage: "本週三有戶外教學。",
                parentAssist: "請家長協助指導數學單元複習並簽名",
                reminder: "帶外套。"
            }];

            return { students: students, classInfo: { schoolName: "崇明國小", className: "三年九班", teacherName: "陽芯妮" }, notesList: defaultNotesList, activeNoteId: defaultId };
        }

        let currentStudentId = null;

        function handleLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('login-student-id').value.trim();
            const rememberMe = document.getElementById('parent-remember-me').checked;
            const systemData = getSystemData();

            if (systemData.students[studentId]) {
                if (rememberMe) {
                    localStorage.setItem('ncm309_remembered_parent_id', studentId);
                } else {
                    localStorage.removeItem('ncm309_remembered_parent_id');
                }
                autoLoginParent(studentId, systemData);
            } else {
                alert("找不到此學號！請確認輸入是否正確。");
            }
        }

        function autoLoginParent(studentId, systemData) {
            currentStudentId = studentId;
            sessionStorage.setItem('ncm309_logged_student', studentId);

            const student = systemData.students[studentId];
            const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };

            document.getElementById('header-child-name').innerText = student.name;
            document.getElementById('header-className-display').innerText = `${cInfo.className} • 座號 ${student.seat} 號`;
            document.getElementById('note-teacher-label').innerHTML = `<i class="fa-solid fa-heart text-rose-500"></i> ${cInfo.teacherName}老師提醒 / 給家長的話：`;

            renderDashboard(student, systemData);

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        function renderDashboard(student, systemData) {
            const activeNote = systemData.notesList[0] || null;
            const yesterdayNote = systemData.notesList[1] || null;

            if (activeNote) {
                document.getElementById('note-display-date').innerText = activeNote.date;
                document.getElementById('note-display-content').innerText = activeNote.content;
                document.getElementById('note-display-message').innerText = activeNote.parentMessage || "尚無留言";
                document.getElementById('note-display-reminder').innerText = activeNote.reminder || "無";
            } else {
                document.getElementById('note-display-date').innerText = "無日期";
                document.getElementById('note-display-content').innerText = "目前尚無當天聯絡簿";
                document.getElementById('note-display-message').innerText = "尚無留言";
                document.getElementById('note-display-reminder').innerText = "無";
            }

            const yesterdayContainer = document.getElementById('yesterday-note-content');
            if (yesterdayNote) {
                yesterdayContainer.innerHTML = `
                    <p class="font-extrabold text-teal-900 text-sm mb-1">📅 ${yesterdayNote.date}</p>
                    <p class="text-sm text-teal-950 font-bold whitespace-pre-line">${yesterdayNote.content}</p>
                    ${yesterdayNote.parentMessage ? `<p class="text-xs text-teal-900 font-bold mt-2 bg-teal-100 p-2.5 rounded-xl border border-teal-900">老師的話：${yesterdayNote.parentMessage}</p>` : ''}
                `;
            } else {
                yesterdayContainer.innerHTML = `<p class="text-xs font-bold text-teal-800 text-center py-2">昨日無上一個聯絡簿紀錄</p>`;
            }

            const statusMap = {
                "1": { text: "繳交", color: "bg-emerald-100 text-emerald-900 border-emerald-900" },
                "2": { text: "已補交", color: "bg-blue-100 text-blue-900 border-blue-900" },
                "3": { text: "未完成", color: "bg-amber-100 text-amber-900 border-amber-900" },
                "4": { text: "需訂正、補交", color: "bg-rose-100 text-rose-900 border-rose-900" },
                "5": { text: "未帶回家", color: "bg-purple-100 text-purple-900 border-purple-900" },
                "6": { text: "未帶到學校", color: "bg-orange-100 text-orange-900 border-orange-900" }
            };

            const yesterdayHwContainer = document.getElementById('yesterday-homework-list');
            yesterdayHwContainer.innerHTML = '';
            if (yesterdayNote && yesterdayNote.content) {
                const yestHwLines = yesterdayNote.content.split('\n').filter(line => line.trim() !== '');
                const yestStudentStatus = (student.homeworkStatus && student.homeworkStatus[yesterdayNote.id]) || {};

                if (yestHwLines.length === 0) {
                    yesterdayHwContainer.innerHTML = `<p class="text-xs font-bold text-teal-800 text-center py-2">昨日無登記作業</p>`;
                } else {
                    yestHwLines.forEach((line, idx) => {
                        const statusKey = yestStudentStatus[idx] || "1";
                        const s = statusMap[statusKey] || statusMap["1"];
                        yesterdayHwContainer.innerHTML += `
                            <div class="flex items-center justify-between p-3.5 rounded-2xl bg-white border-2 border-teal-900 text-sm shadow-sm">
                                <span class="font-extrabold text-teal-950">${line}</span>
                                <span class="px-3 py-1 rounded-full font-extrabold border-2 ${s.color}">${s.text}</span>
                            </div>
                        `;
                    });
                }
            } else {
                yesterdayHwContainer.innerHTML = `<p class="text-xs font-bold text-teal-800 text-center py-2">昨日無作業狀態追蹤</p>`;
            }

            const parentAssistContainer = document.getElementById('parent-assist-homework-list');
            parentAssistContainer.innerHTML = '';
            
            if (activeNote && activeNote.parentAssist && activeNote.parentAssist.trim() !== '') {
                parentAssistContainer.innerHTML = `
                    <div class="p-3.5 bg-white rounded-xl border-2 border-orange-900 text-sm space-y-1 shadow-sm">
                        <span class="font-extrabold text-orange-950"><i class="fa-solid fa-hands-holding-child mr-1 text-orange-600"></i> (${activeNote.date}) 老師指定協助事項：</span>
                        <p class="text-orange-950 font-bold whitespace-pre-line mt-1 pl-4">${activeNote.parentAssist}</p>
                    </div>
                `;
            } else {
                parentAssistContainer.innerHTML = `<p class="text-slate-600 font-bold text-center py-2">目前無特別需家長協助之項目 ✨</p>`;
            }

            const pendingContainer = document.getElementById('pending-injury-list');
            const confirmedContainer = document.getElementById('confirmed-injury-list');
            pendingContainer.innerHTML = '';
            confirmedContainer.innerHTML = '';

            let pendingCount = 0;
            let confirmedCount = 0;

            if (!student.injuries || student.injuries.length === 0) {
                pendingContainer.innerHTML = `<p class="text-center text-xs font-bold text-teal-800 py-3">目前無待確認的傷病通知 🌸</p>`;
                confirmedContainer.innerHTML = `<p class="text-center text-xs font-bold text-teal-800 py-3">尚無已確認的傷病紀錄檔案</p>`;
            } else {
                student.injuries.forEach((inj, index) => {
                    const isConfirmed = inj.confirmed === true;
                    const htmlCard = `
                        <div class="p-4 rounded-2xl ${isConfirmed ? 'bg-emerald-50 border-emerald-900' : 'bg-rose-50 border-rose-900'} border-2 text-sm space-y-2 shadow-sm">
                            <div class="flex justify-between items-center font-extrabold">
                                <span class="${isConfirmed ? 'text-emerald-900' : 'text-rose-900'}">${inj.date} ${inj.time}</span>
                                <span class="text-teal-900 font-bold">處理：${inj.nurse}</span>
                            </div>
                            <div>
                                <p class="font-extrabold text-teal-950">狀況：${inj.symptom}</p>
                                <p class="text-teal-900 font-bold mt-0.5">地點：${inj.location}</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl border-2 ${isConfirmed ? 'border-emerald-900' : 'border-rose-900'} text-teal-950 font-bold">
                                <p class="font-extrabold ${isConfirmed ? 'text-emerald-900' : 'text-rose-900'}">處理經過：</p>
                                <p class="mt-0.5">${inj.treatment}</p>
                            </div>
                            <div class="pt-2 border-t-2 ${isConfirmed ? 'border-emerald-200' : 'border-rose-200'} flex justify-between items-center">
                                <span class="text-xs ${isConfirmed ? 'text-emerald-900 font-extrabold' : 'text-amber-900 font-extrabold'}">
                                    <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                    ${isConfirmed ? '已於 ' + inj.confirmTime + ' 確認收到' : '等待家長確認'}
                                </span>
                                ${!isConfirmed ? `
                                    <button onclick="confirmInjury(${index})" class="bg-amber-400 hover:bg-amber-500 text-teal-950 font-extrabold px-3.5 py-1.5 rounded-xl shadow-sm transition text-xs border-2 border-teal-900">
                                        確認已收到 💛
                                    </button>
                                ` : `
                                    <span class="bg-emerald-200 text-emerald-950 px-3 py-1 rounded-xl font-extrabold text-xs border border-emerald-900">已完成確認 ✓</span>
                                `}
                            </div>
                        </div>
                    `;

                    if (isConfirmed) {
                        confirmedCount++;
                        confirmedContainer.innerHTML += htmlCard;
                    } else {
                        pendingCount++;
                        pendingContainer.innerHTML += htmlCard;
                    }
                });

                if (pendingCount === 0) {
                    pendingContainer.innerHTML = `<p class="text-center text-xs font-bold text-teal-800 py-3">太棒了！所有傷病通知皆已確認完畢 ✨</p>`;
                }
                if (confirmedCount === 0) {
                    confirmedContainer.innerHTML = `<p class="text-center text-xs font-bold text-teal-800 py-3">尚無已確認的傷病紀錄</p>`;
                }
            }

            document.getElementById('pending-injury-count').innerText = pendingCount;
            document.getElementById('confirmed-injury-count').innerText = confirmedCount;
        }

        async function confirmInjury(injuryIndex) {
            const systemData = getSystemData();
            const now = new Date();
            const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            systemData.students[currentStudentId].injuries[injuryIndex].confirmed = true;
            systemData.students[currentStudentId].injuries[injuryIndex].confirmTime = timeString;
            
            localStorage.setItem('ncm309_school_data', JSON.stringify(systemData));
            try {
                await fetch(CLOUD_BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' },
                    body: JSON.stringify(systemData)
                });
            } catch(e) {}

            alert("已成功回報學校：確認收到傷病通知！");
            renderDashboard(systemData.students[currentStudentId], systemData);
        }

        function switchTab(tab) {
            document.getElementById('tab-today').className = tab === 'today' ? "flex-1 py-2.5 text-xs font-extrabold rounded-xl bg-teal-600 text-white shadow-sm transition" : "flex-1 py-2.5 text-xs font-extrabold rounded-lg text-teal-900 transition";
            document.getElementById('tab-injury').className = tab === 'injury' ? "flex-1 py-2.5 text-xs font-extrabold rounded-xl bg-teal-600 text-white shadow-sm transition" : "flex-1 py-2.5 text-xs font-extrabold rounded-lg text-teal-900 transition";

            document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
            document.getElementById('view-injury').classList.toggle('hidden', tab !== 'injury');
        }

        function logout() {
            currentStudentId = null;
            sessionStorage.removeItem('ncm309_logged_student');
            document.getElementById('login-student-id').value = localStorage.getItem('ncm309_remembered_parent_id') || '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
