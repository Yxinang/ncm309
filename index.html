<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級 - 家長即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <header id="app-header" class="bg-indigo-600 text-white shadow-md sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-full">
                    <i class="fa-solid fa-child-reaching text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base" id="header-child-name">載入中...</h1>
                    <p class="text-xs text-indigo-200" id="header-className-display">班級載入中...</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-white bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 登入畫面 -->
        <section id="login-section" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-6 my-auto">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-school"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800" id="login-title-display">親師生聯絡平台</h2>
                <p class="text-xs text-slate-500">請輸入學生學號</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">學生學號</label>
                    <input type="text" id="login-student-id" required placeholder="請輸入學生學號" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition text-sm">
                    進入孩子專區
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                <span id="login-footer-school">崇明國小</span>
                <a href="teacher.html" class="text-indigo-600 hover:underline font-medium"><i class="fa-solid fa-lock mr-1"></i>教師後台登入</a>
            </div>
        </section>

        <!-- 儀表板畫面 -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex bg-slate-200 p-1 rounded-xl">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition">
                    <i class="fa-solid fa-bolt mr-1"></i> 今日聯絡簿與即時狀況
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> 所有歷史紀錄
                </button>
            </div>

            <div id="view-today" class="space-y-6">
                <!-- 聯絡簿抄寫內容 -->
                <section class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 shadow-sm border border-amber-200 space-y-3">
                    <div class="flex justify-between items-center border-b border-amber-200 pb-2">
                        <h2 class="font-bold text-amber-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-book-bookmark text-amber-600"></i> 今日聯絡簿抄寫內容
                        </h2>
                        <span class="text-[11px] text-amber-700 font-medium" id="note-display-date">載入中...</span>
                    </div>
                    <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                        <p class="text-xs text-slate-800 whitespace-pre-line font-medium leading-relaxed" id="note-display-content">載入中...</p>
                    </div>
                    
                    <div class="bg-amber-100/80 p-3 rounded-xl border border-amber-200 space-y-1">
                        <p class="text-[11px] font-bold text-amber-900 flex items-center gap-1" id="note-teacher-label">
                            <i class="fa-solid fa-bullhorn text-amber-600"></i> 老師給家長的話：
                        </p>
                        <p class="text-xs text-amber-950 font-medium leading-relaxed pl-4" id="note-display-message">尚無留言</p>
                    </div>

                    <div class="flex items-center gap-2 text-xs text-amber-800 bg-amber-100/60 p-2.5 rounded-lg">
                        <i class="fa-solid fa-circle-exclamation text-amber-600"></i>
                        <p><span class="font-bold">叮嚀備註：</span><span id="note-display-reminder">載入中...</span></p>
                    </div>
                </section>

                <!-- 作業狀況 -->
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-indigo-500"></i> 作業繳交與訂正狀況
                        </h2>
                        <span class="text-xs text-indigo-600 font-bold" id="homework-summary">0 筆</span>
                    </div>
                    <div class="space-y-2.5" id="today-homework-list"></div>
                </section>

                <!-- 傷病通知 -->
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-notes-medical text-rose-500"></i> 傷病通知單記錄
                        </h2>
                        <span class="text-xs text-rose-600 font-bold" id="today-injury-count">0 筆</span>
                    </div>
                    <div class="space-y-3" id="today-injury-list"></div>
                </section>
            </div>

            <!-- 所有歷史紀錄 -->
            <div id="view-history" class="space-y-6 hidden">
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-box-archive text-indigo-500"></i> 歷史聯絡簿與作業追蹤紀錄
                    </h2>
                    <div class="space-y-3" id="all-history-list"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center text-xs text-slate-400">
        <p id="footer-school-name">崇明國小 • 隨時守護孩子安全</p>
    </footer>

    <script>
        window.onload = function() {
            const systemData = getSystemData();
            if (systemData.classInfo) {
                document.getElementById('login-title-display').innerText = `${systemData.classInfo.className}親師生聯絡平台`;
                document.getElementById('login-footer-school').innerText = systemData.classInfo.schoolName;
                document.getElementById('footer-school-name').innerText = `${systemData.classInfo.schoolName} • 隨時守護孩子安全`;
            }
        };

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                localStorage.setItem('ncm309_school_data', JSON.stringify(freshData));
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.students || Object.keys(parsed.students).length < 25) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function generateDefaultData() {
            const names = [
                "黃琨翔", "陳秉軒", "杜晨翔", "劉景碩", "王宇童", 
                "吳立翔", "陳宇恩", "林楷諾", "李柏衡", "林晉翰", 
                "徐堉綸", "紀孟希", "徐晟瀚", "王知言", "蔡佩穎", 
                "鄭詠心", "郭聿芸", "楊茲甯", "王岑芝", "吳涵儒", 
                "洪楀晴", "林芷萱", "潘若穎", "焉語霓", "蘇唯心"
            ];
            const ids = [
                "113056", "113058", "113164", "113166", "113245", 
                "113140", "113248", "113010", "113037", "113279", 
                "113123", "113200", "113015", "113017", "113151", 
                "113284", "113178", "113204", "113021", "113205", 
                "113232", "113208", "113129", "113134", "113212"
            ];
            let students = {};
            ids.forEach((id, index) => {
                let seatNum = String(index + 1);
                students[id] = {
                    name: names[index],
                    seat: seatNum,
                    homework: [
                        { name: "國文習作第 4 課", status: "1" },
                        { name: "數學隨堂練習卷", status: "3" }
                    ],
                    injuries: []
                };
            });
            students["123"] = {
                name: "測試帳號",
                seat: "30",
                homework: [
                    { name: "國文習作第 4 課", status: "1" },
                    { name: "數學隨堂練習卷", status: "4" }
                ],
                injuries: []
            };

            return {
                students: students,
                classInfo: { schoolName: "崇明國小", className: "三年九班", teacherName: "陽芯妮" },
                contactNote: { date: "民國 115 年 11 月 3 日 (星期二)", content: "1. 國文習作第 4 課完成", parentMessage: "本週三有戶外教學。", reminder: "帶外套。" },
                historyNotes: [],
                teacherAuth: { user: "nini309", pass: "20010909" }
            };
        }

        let currentStudentId = null;

        function handleLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('login-student-id').value.trim();
            const systemData = getSystemData();

            if (systemData.students[studentId]) {
                currentStudentId = studentId;
                const student = systemData.students[studentId];
                const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };

                document.getElementById('header-child-name').innerText = student.name;
                document.getElementById('header-className-display').innerText = `${cInfo.className} • 座號 ${student.seat} 號`;
                document.getElementById('note-teacher-label').innerHTML = `<i class="fa-solid fa-bullhorn text-amber-600"></i> ${cInfo.teacherName}老師給家長的話：`;

                renderDashboard(student, systemData);

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                alert("找不到此學號！請確認輸入是否正確。");
            }
        }

        function renderDashboard(student, systemData) {
            const note = systemData.contactNote;
            document.getElementById('note-display-date').innerText = note.date;
            document.getElementById('note-display-content').innerText = note.content;
            document.getElementById('note-display-message').innerText = note.parentMessage || "尚無留言";
            document.getElementById('note-display-reminder').innerText = note.reminder;

            const statusMap = {
                "1": { text: "繳交", color: "bg-emerald-50 text-emerald-600 border-emerald-200" },
                "2": { text: "已補交", color: "bg-blue-50 text-blue-600 border-blue-200" },
                "3": { text: "未完成", color: "bg-amber-50 text-amber-600 border-amber-200" },
                "4": { text: "需訂正、補交", color: "bg-rose-50 text-rose-600 border-rose-200" }
            };

            const hwContainer = document.getElementById('today-homework-list');
            hwContainer.innerHTML = '';
            student.homework.forEach(hw => {
                const s = statusMap[hw.status] || statusMap["3"];
                hwContainer.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                        <span class="font-medium text-slate-700">${hw.name}</span>
                        <span class="px-2.5 py-1 rounded-full font-bold border ${s.color}">
                            ${s.text}
                        </span>
                    </div>
                `;
            });
            document.getElementById('homework-summary').innerText = `${student.homework.length} 項作業`;

            const injuryContainer = document.getElementById('today-injury-list');
            const historyContainer = document.getElementById('all-history-list');
            injuryContainer.innerHTML = '';
            historyContainer.innerHTML = '';
            document.getElementById('today-injury-count').innerText = `${student.injuries.length} 筆`;

            if (student.injuries.length === 0) {
                injuryContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">近期無傷病通知紀錄 🎉</p>`;
            } else {
                student.injuries.forEach((inj, index) => {
                    const isConfirmed = inj.confirmed === true;
                    injuryContainer.innerHTML += `
                        <div class="p-3.5 rounded-xl bg-rose-50 border border-rose-100 text-xs space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-rose-600">${inj.date} ${inj.time}</span>
                                <span class="text-slate-500">處理：${inj.nurse}</span>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">狀況：${inj.symptom}</p>
                                <p class="text-slate-600 mt-0.5">地點：${inj.location}</p>
                            </div>
                            <div class="bg-white p-2.5 rounded-lg border border-rose-100 text-slate-700">
                                <p class="font-semibold text-rose-700">處理經過：</p>
                                <p>${inj.treatment}</p>
                            </div>
                            <div class="pt-2 border-t border-rose-200 flex justify-between items-center">
                                <span class="text-[11px] ${isConfirmed ? 'text-emerald-600 font-bold' : 'text-amber-600'}">
                                    <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                    ${isConfirmed ? '已於 ' + inj.confirmTime + ' 確認收到' : '尚未確認收到'}
                                </span>
                                ${!isConfirmed ? `
                                    <button onclick="confirmInjury(${index})" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold px-3 py-1.5 rounded-lg shadow transition text-[11px]">
                                        確認已收到訊息
                                    </button>
                                ` : `
                                    <span class="bg-emerald-100 text-emerald-800 px-2.5 py-1 rounded-lg font-bold text-[11px]">已完成確認</span>
                                `}
                            </div>
                        </div>
                    `;
                });
            }

            let historyHtml = `<div class="p-3 bg-slate-50 rounded-xl border text-xs space-y-1"><p class="font-bold text-indigo-600">📅 當前聯絡簿 (${note.date})</p><p class="text-slate-700 whitespace-pre-line">${note.content}</p></div>`;
            
            if (systemData.historyNotes && systemData.historyNotes.length > 0) {
                systemData.historyNotes.forEach(hn => {
                    historyHtml += `
                        <div class="p-3 bg-slate-50 rounded-xl border text-xs space-y-1">
                            <p class="font-bold text-indigo-600">📜 歷史聯絡簿 (${hn.date})</p>
                            <p class="text-slate-700 whitespace-pre-line">${hn.content}</p>
                        </div>
                    `;
                });
            }

            historyContainer.innerHTML = historyHtml;
        }

        function confirmInjury(injuryIndex) {
            const systemData = getSystemData();
            const now = new Date();
            const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            systemData.students[currentStudentId].injuries[injuryIndex].confirmed = true;
            systemData.students[currentStudentId].injuries[injuryIndex].confirmTime = timeString;
            
            localStorage.setItem('ncm309_school_data', JSON.stringify(systemData));
            alert("已成功回報學校：確認收到傷病通知！");
            renderDashboard(systemData.students[currentStudentId], systemData);
        }

        function switchTab(tab) {
            document.getElementById('tab-today').className = tab === 'today' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
            document.getElementById('tab-history').className = tab === 'history' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";

            document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
        }

        function logout() {
            currentStudentId = null;
            document.getElementById('login-student-id').value = '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
