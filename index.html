<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級 - 家長即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #E6F4F1; font-family: system-ui, -apple-system, sans-serif; color: #2F4F4F; }
        .soft-card { background-color: #FFFFFF; border: 2px solid #A3D2CA; border-radius: 28px; box-shadow: 0 4px 12px rgba(47, 79, 79, 0.05); }
        .soft-header { background-color: #F0F7F6; border-bottom: 2px solid #A3D2CA; border-top-left-radius: 25px; border-top-right-radius: 25px; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header id="app-header" class="bg-[#598379] text-white shadow-sm sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/80 p-2 rounded-2xl text-[#2F4F4F] shadow-sm">
                    <i class="fa-solid fa-fish-fins text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base" id="header-child-name">載入中...</h1>
                    <p class="text-xs text-[#E6F4F1]" id="header-className-display">班級載入中...</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-[#2F4F4F] bg-[#C8E6C9] hover:bg-[#A5D6A7] px-3.5 py-2 rounded-xl transition flex items-center gap-1 font-bold shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 登入畫面 -->
        <section id="login-section" class="soft-card p-6 space-y-6 my-auto">
            <div class="text-center space-y-3">
                <div class="w-16 h-16 bg-[#C8E6C9] text-[#2F4F4F] rounded-3xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-whale"></i>
                </div>
                <h2 class="text-xl font-bold text-[#2F4F4F]" id="login-title-display">親師生溫馨聯絡平台</h2>
                <p class="text-xs text-[#598379]">請輸入學生學號來陪伴寶貝每一天 ✨</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-sm">
                <div>
                    <label class="block font-bold text-[#2F4F4F] mb-1">學生學號</label>
                    <input type="text" id="login-student-id" required placeholder="請輸入學生學號" class="w-full px-4 py-3.5 rounded-2xl border-2 border-[#A3D2CA] bg-[#F0F7F6] text-sm focus:ring-2 focus:ring-[#598379] outline-none">
                </div>
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="parent-remember-me" class="w-5 h-5 text-[#598379] rounded border-[#A3D2CA]">
                    <label for="parent-remember-me" class="ml-2 text-[#2F4F4F] font-bold text-xs">記住我 (下次自動登入)</label>
                </div>
                <button type="submit" class="w-full bg-[#598379] hover:bg-[#4A6B63] text-white font-bold py-3.5 rounded-2xl shadow-md transition text-base">
                    進入專屬小天地 🧸
                </button>
            </form>

            <div class="pt-4 border-t border-[#A3D2CA] flex justify-between items-center text-xs text-[#598379]">
                <span id="login-footer-school">崇明國小</span>
                <a href="teacher.html" class="text-[#598379] hover:underline font-bold"><i class="fa-solid fa-lock mr-1"></i>教師後台</a>
            </div>
        </section>

        <!-- 儀表板主畫面 -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex bg-[#D8E8E5] p-1.5 rounded-2xl border-2 border-[#A3D2CA]">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition">
                    今日聯絡簿與作業
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-xs font-bold rounded-lg text-[#598379] transition">
                    歷史點滴紀錄
                </button>
                <button onclick="switchTab('injury')" id="tab-injury" class="flex-1 py-2 text-xs font-bold rounded-lg text-[#598379] transition">
                    傷病通知紀錄
                </button>
            </div>

            <!-- 第一頁：今日聯絡簿與作業四大區塊 -->
            <div id="view-today" class="space-y-6">
                
                <!-- 當天聯絡簿內容與老師提醒 -->
                <section class="soft-card p-5 space-y-3">
                    <div class="soft-header px-4 py-2.5 flex justify-between items-center -mx-5 -mt-5 mb-3">
                        <h2 class="font-bold text-[#2F4F4F] text-sm flex items-center gap-2">
                            <i class="fa-solid fa-star text-amber-600"></i> 當天聯絡簿內容
                        </h2>
                        <span class="text-xs text-[#2F4F4F] font-bold bg-[#C8E6C9] px-3 py-1 rounded-full shadow-sm" id="note-display-date">載入中...</span>
                    </div>
                    <div class="bg-[#F0F7F6] p-4 rounded-2xl border border-[#A3D2CA] shadow-sm">
                        <p class="text-sm text-[#2F4F4F] whitespace-pre-line font-medium leading-relaxed" id="note-display-content">載入中...</p>
                    </div>
                    
                    <div class="bg-[#FFF8E1] p-4 rounded-2xl border border-[#FFE082] space-y-1">
                        <p class="text-xs font-bold text-[#8D6E63] flex items-center gap-1" id="note-teacher-label">
                            <i class="fa-solid fa-heart text-rose-500"></i> 老師提醒 / 給家長的話：
                        </p>
                        <p class="text-sm text-[#3E2723] font-medium leading-relaxed pl-4" id="note-display-message">尚無留言</p>
                    </div>

                    <div class="flex items-center gap-2 text-xs text-[#2F4F4F] bg-[#E0F2F1] p-3.5 rounded-2xl border border-[#B2DFDB]">
                        <i class="fa-solid fa-bell text-[#00897B] text-base"></i>
                        <p class="text-sm"><span class="font-bold">叮嚀備註：</span><span id="note-display-reminder">載入中...</span></p>
                    </div>
                </section>

                <!-- 昨天聯絡簿內容 -->
                <section class="soft-card p-5 space-y-3">
                    <h2 class="font-bold text-[#2F4F4F] text-sm flex items-center gap-2 border-b border-[#A3D2CA] pb-2">
                        <i class="fa-solid fa-clock-rotate-left text-[#598379]"></i> 昨天聯絡簿內容
                    </h2>
                    <div class="bg-[#F0F7F6] p-4 rounded-2xl border border-[#A3D2CA] text-sm" id="yesterday-note-content">
                        <p class="text-xs text-slate-400 text-center py-2">昨日無上一個聯絡簿紀錄</p>
                    </div>
                </section>

                <!-- 昨天作業今天繳交狀態 -->
                <section class="soft-card p-5 space-y-3">
                    <h2 class="font-bold text-[#2F4F4F] text-sm flex items-center gap-2 border-b border-[#A3D2CA] pb-2">
                        <i class="fa-solid fa-list-check text-[#598379]"></i> 昨天作業今天到校繳交狀態
                    </h2>
                    <div class="space-y-2.5 text-sm" id="yesterday-homework-list">
                        <p class="text-xs text-slate-400 text-center py-2">昨日無登記作業狀態</p>
                    </div>
                </section>

                <!-- 需家長協助完成之作業 (個別學生專屬資料) -->
                <section class="soft-card p-5 space-y-3 bg-[#FFF9C4]/30 border-[#FFE082]">
                    <h2 class="font-bold text-[#5D4037] text-sm flex items-center gap-2 border-b border-[#FFE082] pb-2">
                        <i class="fa-solid fa-hands-holding-child text-amber-600"></i> 需家長協助完成之作業 / 個別事項
                    </h2>
                    <div class="bg-white p-4 rounded-2xl border border-[#FFE082] text-sm space-y-2" id="parent-assist-homework-list">
                        <p class="text-slate-500 text-center py-1">目前無特別需家長協助之項目 ✨</p>
                    </div>
                </section>

            </div>

            <!-- 第二頁：歷史點滴紀錄 -->
            <div id="view-history" class="space-y-6 hidden">
                <section class="soft-card p-5 space-y-4">
                    <h2 class="font-bold text-[#2F4F4F] text-sm flex items-center gap-2 border-b border-[#A3D2CA] pb-2">
                        <i class="fa-solid fa-box-archive text-[#598379]"></i> 歷史聯絡簿完整總覽（隨時翻閱）
                    </h2>
                    <div class="space-y-3 max-h-96 overflow-y-auto pr-1" id="all-history-notes-container"></div>
                </section>
            </div>

            <!-- 第三頁：傷病通知紀錄 -->
            <div id="view-injury" class="space-y-6 hidden">
                <section class="soft-card p-5 space-y-4">
                    <h2 class="font-bold text-[#2F4F4F] text-sm flex items-center gap-2 border-b border-[#A3D2CA] pb-2">
                        <i class="fa-solid fa-clock text-[#598379]"></i> 老師上傳，等待家長確認（<span id="pending-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-3 text-sm" id="pending-injury-list"></div>
                </section>

                <section class="soft-card p-5 space-y-4 border-[#A5D6A7]">
                    <h2 class="font-bold text-[#2E7D32] text-sm flex items-center gap-2 border-b border-[#C8E6C9] pb-2">
                        <i class="fa-solid fa-circle-check text-emerald-600"></i> 家長已確認收到紀錄（<span id="confirmed-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-3 text-sm" id="confirmed-injury-list"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-[#598379]">
        <p id="footer-school-name">崇明國小 • 溫馨守護每一刻 💛</p>
    </footer>

    <script>
        const CLOUD_BIN_URL = 'https://api.jsonbin.io/v3/b/65f6c82d3dcbb1b7cc342831';

        window.onload = async function() {
            await syncLoadData();
            const systemData = getSystemData();
            if (systemData.classInfo) {
                document.getElementById('login-title-display').innerText = `${systemData.classInfo.className} 溫馨平台`;
                document.getElementById('login-footer-school').innerText = systemData.classInfo.schoolName;
                document.getElementById('footer-school-name').innerText = `${systemData.classInfo.schoolName} • 溫馨守護每一刻 💛`;
            }

            const rememberedId = localStorage.getItem('ncm309_remembered_parent_id');
            if (rememberedId && systemData.students[rememberedId]) {
                document.getElementById('login-student-id').value = rememberedId;
                document.getElementById('parent-remember-me').checked = true;
                autoLoginParent(rememberedId, systemData);
            }

            setInterval(async () => {
                await syncLoadData();
                if (currentStudentId) {
                    const latestData = getSystemData();
                    if (latestData.students[currentStudentId]) {
                        renderDashboard(latestData.students[currentStudentId], latestData);
                    }
                }
            }, 3000);
        };

        async function syncLoadData() {
            try {
                const response = await cacheBustFetch(`${CLOUD_BIN_URL}/latest`);
                if (response.ok) {
                    const cloudResult = await response.json();
                    if (cloudResult && cloudResult.record) {
                        if (cloudResult.record.notesList && Array.isArray(cloudResult.record.notesList)) {
                            cloudResult.record.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
                        }
                        localStorage.setItem('ncm309_school_data', JSON.stringify(cloudResult.record));
                    }
                }
            } catch (e) {
                console.log("使用本地快取資料");
            }
        }

        async function cacheBustFetch(url) {
            const separator = url.includes('?') ? '&' : '?';
            return fetch(`${url}${separator}_t=${new Date().getTime()}`, {
                headers: { 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' }
            });
        }

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                localStorage.setItem('ncm309_school_data', JSON.stringify(freshData));
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList || parsed.notesList.length === 0) {
                    parsed.notesList = freshData.notesList;
                } else {
                    parsed.notesList.sort((a, b) => new Date(b.id) - new Date(a.id));
                }
                if (!parsed.students || Object.keys(parsed.students).length < 25) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function getTaiwanTaipeiDateString() {
            const now = new Date();
            const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long' };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            const parts = formatter.formatToParts(now);
            
            let year = '', month = '', day = '', weekday = '';
            parts.forEach(part => {
                if (part.type === 'year') year = parseInt(part.value) - 1911;
                if (part.type === 'month') month = part.value;
                if (part.type === 'day') day = part.value;
                if (part.type === 'weekday') weekday = part.value;
            });
            return `民國 ${year} 年 ${month} 月 ${day} 日 (${weekday})`;
        }

        function generateDefaultData() {
            const names = ["黃琨翔", "陳秉軒", "杜晨翔", "劉景碩", "王宇童", "吳立翔", "陳宇恩", "林楷諾", "李柏衡", "林晉翰", "徐堉綸", "紀孟希", "徐晟瀚", "王知言", "蔡佩穎", "鄭詠心", "郭聿芸", "楊茲甯", "王岑芝", "吳涵儒", "洪楀晴", "林芷萱", "潘若穎", "焉語霓", "蘇唯心"];
            const ids = ["113056", "113058", "113164", "113166", "113245", "113140", "113248", "113010", "113037", "113279", "113123", "113200", "113015", "113017", "113151", "113284", "113178", "113204", "113021", "113205", "113232", "113208", "113129", "113134", "113212"];
            let students = {};
            ids.forEach((id, index) => {
                students[id] = { name: names[index], seat: String(index + 1), homeworkStatus: {}, parentAssist: "", injuries: [] };
            });
            students["123"] = { name: "測試帳號", seat: "30", homeworkStatus: {}, parentAssist: "", injuries: [] };

            const defaultId = new Date().toISOString();
            const defaultNotesList = [{
                id: defaultId,
                date: getTaiwanTaipeiDateString(),
                content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷",
                parentMessage: "本週三有戶外教學。",
                reminder: "帶外套。"
            }];

            return { students: students, classInfo: { schoolName: "崇明國小", className: "三年九班", teacherName: "陽芯妮" }, notesList: defaultNotesList };
        }

        let currentStudentId = null;

        function handleLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('login-student-id').value.trim();
            const rememberMe = document.getElementById('parent-remember-me').checked;
            const systemData = getSystemData();

            if (systemData.students[studentId]) {
                if (rememberMe) {
                    localStorage.setItem('ncm309_remembered_parent_id', studentId);
                } else {
                    localStorage.removeItem('ncm309_remembered_parent_id');
                }
                autoLoginParent(studentId, systemData);
            } else {
                alert("找不到此學號！請確認輸入是否正確。");
            }
        }

        function autoLoginParent(studentId, systemData) {
            currentStudentId = studentId;
            sessionStorage.setItem('ncm309_logged_student', studentId);

            const student = systemData.students[studentId];
            const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };

            document.getElementById('header-child-name').innerText = student.name;
            document.getElementById('header-className-display').innerText = `${cInfo.className} • 座號 ${student.seat} 號`;
            document.getElementById('note-teacher-label').innerHTML = `<i class="fa-solid fa-heart text-rose-500"></i> ${cInfo.teacherName}老師提醒 / 給家長的話：`;

            renderDashboard(student, systemData);

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        function renderDashboard(student, systemData) {
            const activeNote = systemData.notesList[0] || null;
            const yesterdayNote = systemData.notesList[1] || null;

            if (activeNote) {
                document.getElementById('note-display-date').innerText = activeNote.date;
                document.getElementById('note-display-content').innerText = activeNote.content;
                document.getElementById('note-display-message').innerText = activeNote.parentMessage || "尚無留言";
                document.getElementById('note-display-reminder').innerText = activeNote.reminder || "無";
            } else {
                document.getElementById('note-display-date').innerText = "無日期";
                document.getElementById('note-display-content').innerText = "目前尚無當天聯絡簿";
                document.getElementById('note-display-message').innerText = "尚無留言";
                document.getElementById('note-display-reminder').innerText = "無";
            }

            const yesterdayContainer = document.getElementById('yesterday-note-content');
            if (yesterdayNote) {
                yesterdayContainer.innerHTML = `
                    <p class="font-bold text-[#2F4F4F] text-sm mb-1">📅 ${yesterdayNote.date}</p>
                    <p class="text-sm text-[#2F4F4F] whitespace-pre-line font-medium">${yesterdayNote.content}</p>
                    ${yesterdayNote.parentMessage ? `<p class="text-sm text-[#2F4F4F] mt-2 bg-[#E0F2F1] p-2.5 rounded-xl font-medium">老師的話：${yesterdayNote.parentMessage}</p>` : ''}
                `;
            } else {
                yesterdayContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無上一個聯絡簿紀錄</p>`;
            }

            const statusMap = {
                "1": { text: "繳交", color: "bg-[#C8E6C9] text-[#1B5E20] border-[#A5D6A7]" },
                "2": { text: "已補交", color: "bg-[#BBDEFB] text-[#0D47A1] border-[#90CAF9]" },
                "3": { text: "未完成", color: "bg-[#FFE082] text-[#5D4037] border-[#FFD54F]" },
                "4": { text: "需訂正、補交", color: "bg-[#FFCDD2] text-[#B71C1C] border-[#EF9A9A]" },
                "5": { text: "未帶回家", color: "bg-[#E1BEE7] text-[#4A148C] border-[#CE93D8]" },
                "6": { text: "未帶到學校", color: "bg-[#FFE0B2] text-[#E65100] border-[#FFCC80]" }
            };

            const yesterdayHwContainer = document.getElementById('yesterday-homework-list');
            yesterdayHwContainer.innerHTML = '';
            if (yesterdayNote && yesterdayNote.content) {
                const yestHwLines = yesterdayNote.content.split('\n').filter(line => line.trim() !== '');
                const yestStudentStatus = (student.homeworkStatus && student.homeworkStatus[yesterdayNote.id]) || {};

                if (yestHwLines.length === 0) {
                    yesterdayHwContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無登記作業</p>`;
                } else {
                    yestHwLines.forEach((line, idx) => {
                        const statusKey = yestStudentStatus[idx] || "1";
                        const s = statusMap[statusKey] || statusMap["1"];
                        yesterdayHwContainer.innerHTML += `
                            <div class="flex items-center justify-between p-3.5 rounded-2xl bg-[#F0F7F6] border border-[#A3D2CA] text-sm">
                                <span class="font-bold text-[#2F4F4F]">${line}</span>
                                <span class="px-3.5 py-1 rounded-full font-bold border ${s.color}">${s.text}</span>
                            </div>
                        `;
                    });
                }
            } else {
                yesterdayHwContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無作業狀態追蹤</p>`;
            }

            // 個別學生專屬的需家長協助作業/事項顯示
            const parentAssistContainer = document.getElementById('parent-assist-homework-list');
            parentAssistContainer.innerHTML = '';
            
            if (student.parentAssist && student.parentAssist.trim() !== '') {
                parentAssistContainer.innerHTML = `
                    <div class="p-3.5 bg-[#FFF9C4] rounded-xl border border-[#FFE082] text-sm space-y-1">
                        <span class="font-bold text-[#5D4037]"><i class="fa-solid fa-hands-holding-child mr-1"></i> 老師給家長的個別協助事項：</span>
                        <p class="text-[#3E2723] whitespace-pre-line mt-1 pl-4 font-medium">${student.parentAssist}</p>
                    </div>
                `;
            } else {
                parentAssistContainer.innerHTML = `<p class="text-slate-500 text-center py-2 font-medium">目前無特別需家長協助之項目 ✨</p>`;
            }

            const historyNotesContainer = document.getElementById('all-history-notes-container');
            historyNotesContainer.innerHTML = '';
            if (systemData.notesList.length === 0) {
                historyNotesContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無歷史聯絡簿紀錄</p>`;
            } else {
                systemData.notesList.forEach(note => {
                    historyNotesContainer.innerHTML += `
                        <div class="p-4 bg-[#F0F7F6] rounded-2xl border border-[#A3D2CA] text-sm space-y-1.5">
                            <p class="font-bold text-[#2F4F4F]"><i class="fa-solid fa-calendar-days mr-1 text-[#598379]"></i> ${note.date}</p>
                            <p class="text-slate-800 whitespace-pre-line font-medium">${note.content}</p>
                            ${note.parentMessage ? `<p class="text-[#2F4F4F] bg-[#E0F2F1] p-2.5 rounded-xl mt-1 font-medium">老師的話：${note.parentMessage}</p>` : ''}
                            ${note.reminder ? `<p class="text-[#00897B] bg-[#E0F2F1] p-2 rounded-xl mt-1 font-medium">叮嚀備註：${note.reminder}</p>` : ''}
                        </div>
                    `;
                });
            }

            const pendingContainer = document.getElementById('pending-injury-list');
            const confirmedContainer = document.getElementById('confirmed-injury-list');
            pendingContainer.innerHTML = '';
            confirmedContainer.innerHTML = '';

            let pendingCount = 0;
            let confirmedCount = 0;

            if (!student.injuries || student.injuries.length === 0) {
                pendingContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">目前無待確認的傷病通知 🌸</p>`;
                confirmedContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無已確認的傷病紀錄檔案</p>`;
            } else {
                student.injuries.forEach((inj, index) => {
                    const isConfirmed = inj.confirmed === true;
                    const htmlCard = `
                        <div class="p-4 rounded-2xl ${isConfirmed ? 'bg-[#E8F5E9] border-[#A5D6A7]' : 'bg-[#FFEBEE] border-[#EF9A9A]'} border text-sm space-y-2 shadow-sm">
                            <div class="flex justify-between items-center font-bold">
                                <span class="${isConfirmed ? 'text-[#2E7D32]' : 'text-[#C62828]'}">${inj.date} ${inj.time}</span>
                                <span class="text-[#598379]">處理：${inj.nurse}</span>
                            </div>
                            <div>
                                <p class="font-bold text-slate-900">狀況：${inj.symptom}</p>
                                <p class="text-slate-700 mt-0.5">地點：${inj.location}</p>
                            </div>
                            <div class="bg-white p-3.5 rounded-xl border ${isConfirmed ? 'border-[#C8E6C9]' : 'border-[#FFCDD2]'} text-slate-800 font-medium">
                                <p class="font-bold ${isConfirmed ? 'text-[#2E7D32]' : 'text-[#C62828]'}">處理經過：</p>
                                <p class="mt-0.5">${inj.treatment}</p>
                            </div>
                            <div class="pt-2 border-t ${isConfirmed ? 'border-[#C8E6C9]' : 'border-[#FFCDD2]'} flex justify-between items-center">
                                <span class="text-xs ${isConfirmed ? 'text-emerald-700 font-bold' : 'text-amber-800 font-bold'}">
                                    <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                    ${isConfirmed ? '已於 ' + inj.confirmTime + ' 確認收到' : '等待家長確認'}
                                </span>
                                ${!isConfirmed ? `
                                    <button onclick="confirmInjury(${index})" class="bg-[#598379] hover:bg-[#4A6B63] text-white font-bold px-4 py-2 rounded-xl shadow-sm transition text-xs">
                                        確認已收到訊息 💛
                                    </button>
                                ` : `
                                    <span class="bg-[#C8E6C9] text-[#1B5E20] px-3 py-1.5 rounded-xl font-bold text-xs">已完成確認 ✓</span>
                                `}
                            </div>
                        </div>
                    `;

                    if (isConfirmed) {
                        confirmedCount++;
                        confirmedContainer.innerHTML += htmlCard;
                    } else {
                        pendingCount++;
                        pendingContainer.innerHTML += htmlCard;
                    }
                });

                if (pendingCount === 0) {
                    pendingContainer.innerHTML = `<p class="text-center text-xs text-[#598379] font-bold py-3">太棒了！所有傷病通知皆已確認完畢 ✨</p>`;
                }
                if (confirmedCount === 0) {
                    confirmedContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無已確認的傷病紀錄</p>`;
                }
            }

            document.getElementById('pending-injury-count').innerText = pendingCount;
            document.getElementById('confirmed-injury-count').innerText = confirmedCount;
        }

        async function confirmInjury(injuryIndex) {
            const systemData = getSystemData();
            const now = new Date();
            const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            systemData.students[currentStudentId].injuries[injuryIndex].confirmed = true;
            systemData.students[currentStudentId].injuries[injuryIndex].confirmTime = timeString;
            
            localStorage.setItem('ncm309_school_data', JSON.stringify(systemData));
            try {
                await fetch(CLOUD_BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' },
                    body: JSON.stringify(systemData)
                });
            } catch(e) {}

            alert("已成功回報學校：確認收到傷病通知！");
            renderDashboard(systemData.students[currentStudentId], systemData);
        }

        function switchTab(tab) {
            document.getElementById('tab-today').className = tab === 'today' ? "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-[#598379] transition";
            document.getElementById('tab-history').className = tab === 'history' ? "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-[#598379] transition";
            document.getElementById('tab-injury').className = tab === 'injury' ? "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-[#2F4F4F] shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-[#598379] transition";

            document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
            document.getElementById('view-injury').classList.toggle('hidden', tab !== 'injury');
        }

        function logout() {
            currentStudentId = null;
            sessionStorage.removeItem('ncm309_logged_student');
            document.getElementById('login-student-id').value = localStorage.getItem('ncm309_remembered_parent_id') || '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
