<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>班級 - 家長即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        body { background-color: #fffaf5; font-family: system-ui, -apple-system, sans-serif; color: #5a4d41; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <header id="app-header" class="bg-amber-400 text-amber-950 shadow-sm sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/60 p-2 rounded-2xl text-amber-800 shadow-sm">
                    <i class="fa-solid fa-paw text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-sm" id="header-child-name">載入中...</h1>
                    <p class="text-xs text-amber-950/70" id="header-className-display">班級載入中...</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-amber-900 bg-amber-200/80 hover:bg-amber-300 px-3 py-1.5 rounded-xl transition flex items-center gap-1 font-bold shadow-sm">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 登入畫面 -->
        <section id="login-section" class="bg-white rounded-3xl p-6 shadow-sm border border-amber-100 space-y-6 my-auto">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-amber-100 text-amber-600 rounded-3xl flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-cat"></i>
                </div>
                <h2 class="text-xl font-bold text-amber-900" id="login-title-display">親師生溫馨聯絡平台</h2>
                <p class="text-xs text-amber-700/70">請輸入學生學號來陪伴寶貝每一天 ✨</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4 text-xs">
                <div>
                    <label class="block font-bold text-amber-900/80 mb-1">學生學號</label>
                    <input type="text" id="login-student-id" required placeholder="請輸入學生學號" class="w-full px-4 py-3 rounded-2xl border border-amber-200 bg-amber-50/30 text-sm focus:ring-2 focus:ring-amber-400 outline-none">
                </div>
                <div class="flex items-center pt-1">
                    <input type="checkbox" id="parent-remember-me" class="w-4 h-4 text-amber-600 rounded border-amber-300">
                    <label for="parent-remember-me" class="ml-2 text-amber-900 font-medium">記住我 (下次自動登入)</label>
                </div>
                <button type="submit" class="w-full bg-amber-500 hover:bg-amber-600 text-white font-bold py-3 rounded-2xl shadow-md transition text-sm">
                    進入專屬小天地 🧸
                </button>
            </form>

            <div class="pt-4 border-t border-amber-100 flex justify-between items-center text-xs text-amber-800/60">
                <span id="login-footer-school">崇明國小</span>
                <a href="teacher.html" class="text-amber-700 hover:underline font-bold"><i class="fa-solid fa-lock mr-1"></i>教師後台</a>
            </div>
        </section>

        <!-- 儀表板主畫面 -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex bg-amber-100/60 p-1 rounded-2xl border border-amber-200/60">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 text-xs font-bold rounded-xl bg-white text-amber-900 shadow-sm transition">
                    <i class="fa-solid fa-sun mr-1"></i> 首頁 (聯絡簿與作業)
                </button>
                <button onclick="switchTab('injury')" id="tab-injury" class="flex-1 py-2 text-xs font-bold rounded-lg text-amber-800/70 transition">
                    <i class="fa-solid fa-notes-medical mr-1"></i> 傷病通知紀錄
                </button>
            </div>

            <!-- 第一頁：聯絡簿與作業四大區塊 -->
            <div id="view-today" class="space-y-6">
                
                <!-- 第一區塊：當天聯絡簿內容與老師提醒 -->
                <section class="bg-gradient-to-br from-amber-50 to-orange-50/50 rounded-3xl p-5 shadow-sm border border-amber-200/80 space-y-3">
                    <div class="flex justify-between items-center border-b border-amber-200/60 pb-2">
                        <h2 class="font-bold text-amber-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-star text-amber-500"></i> 第一區塊：當天聯絡簿內容
                        </h2>
                        <span class="text-[11px] text-amber-800 font-bold bg-amber-200/50 px-2.5 py-0.5 rounded-full" id="note-display-date">載入中...</span>
                    </div>
                    <div class="bg-white/90 p-4 rounded-2xl border border-amber-100 shadow-sm">
                        <p class="text-xs text-slate-700 whitespace-pre-line font-medium leading-relaxed" id="note-display-content">載入中...</p>
                    </div>
                    
                    <div class="bg-amber-100/70 p-3.5 rounded-2xl border border-amber-200/60 space-y-1">
                        <p class="text-[11px] font-bold text-amber-900 flex items-center gap-1" id="note-teacher-label">
                            <i class="fa-solid fa-heart text-rose-500"></i> 老師提醒 / 給家長的話：
                        </p>
                        <p class="text-xs text-amber-950 font-medium leading-relaxed pl-4" id="note-display-message">尚無留言</p>
                    </div>

                    <div class="flex items-center gap-2 text-xs text-amber-900 bg-amber-200/40 p-3 rounded-2xl">
                        <i class="fa-solid fa-bell text-amber-600"></i>
                        <p><span class="font-bold">叮嚀備註：</span><span id="note-display-reminder">載入中...</span></p>
                    </div>
                </section>

                <!-- 第二區塊：昨天聯絡簿內容 -->
                <section class="bg-white rounded-3xl p-5 shadow-sm border border-amber-100 space-y-3">
                    <h2 class="font-bold text-amber-900 text-sm flex items-center gap-2 border-b border-amber-100 pb-2">
                        <i class="fa-solid fa-clock-rotate-left text-amber-500"></i> 第二區塊：昨天聯絡簿內容
                    </h2>
                    <div class="bg-amber-50/40 p-4 rounded-2xl border border-amber-100" id="yesterday-note-content">
                        <p class="text-xs text-slate-400 text-center py-2">昨日無上一個聯絡簿紀錄</p>
                    </div>
                </section>

                <!-- 第三區塊：昨天作業今天繳交狀態 -->
                <section class="bg-white rounded-3xl p-5 shadow-sm border border-amber-100 space-y-3">
                    <h2 class="font-bold text-amber-900 text-sm flex items-center gap-2 border-b border-amber-100 pb-2">
                        <i class="fa-solid fa-list-check text-amber-500"></i> 第三區塊：昨天作業今天到校繳交狀態
                    </h2>
                    <div class="space-y-2.5" id="yesterday-homework-list">
                        <p class="text-xs text-slate-400 text-center py-2">昨日無登記作業狀態</p>
                    </div>
                </section>

                <!-- 第四區塊：需家長協助完成之作業 -->
                <section class="bg-gradient-to-br from-orange-50 to-amber-50 rounded-3xl p-5 shadow-sm border border-orange-200 space-y-3">
                    <h2 class="font-bold text-orange-900 text-sm flex items-center gap-2 border-b border-orange-200 pb-2">
                        <i class="fa-solid fa-hands-holding-child text-orange-500"></i> 第四區塊：需家長協助完成之作業 / 親子共學
                    </h2>
                    <div class="bg-white/90 p-4 rounded-2xl border border-orange-100 text-xs" id="parent-assist-homework-list">
                        <p class="text-slate-500 text-center py-1">目前無特別需家長協助之項目 ✨</p>
                    </div>
                </section>

            </div>

            <!-- 第二頁：傷病通知的紀錄（雙區塊：未確認 vs 已確認） -->
            <div id="view-injury" class="space-y-6 hidden">
                
                <!-- 第一區塊：老師上傳，家長未確認 -->
                <section class="bg-white rounded-3xl p-5 shadow-sm border border-amber-200 space-y-4">
                    <h2 class="font-bold text-amber-900 text-sm flex items-center gap-2 border-b border-amber-100 pb-2">
                        <i class="fa-solid fa-clock text-amber-500"></i> 第一區塊：老師上傳，等待家長確認（<span id="pending-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-3" id="pending-injury-list"></div>
                </section>

                <!-- 第二區塊：家長已確認區塊 -->
                <section class="bg-white rounded-3xl p-5 shadow-sm border border-emerald-200 space-y-4">
                    <h2 class="font-bold text-emerald-900 text-sm flex items-center gap-2 border-b border-emerald-100 pb-2">
                        <i class="fa-solid fa-circle-check text-emerald-500"></i> 第二區塊：家長已確認收到紀錄（<span id="confirmed-injury-count">0</span> 筆）
                    </h2>
                    <div class="space-y-3" id="confirmed-injury-list"></div>
                </section>

            </div>
        </div>
    </main>

    <footer class="py-4 text-center text-xs text-amber-900/50">
        <p id="footer-school-name">崇明國小 • 溫馨守護每一刻 💛</p>
    </footer>

    <script>
        const CLOUD_BIN_URL = 'https://api.jsonbin.io/v3/b/65f6c82d3dcbb1b7cc342831';

        window.onload = async function() {
            await syncLoadData();
            const systemData = getSystemData();
            if (systemData.classInfo) {
                document.getElementById('login-title-display').innerText = `${systemData.classInfo.className} 溫馨平台`;
                document.getElementById('login-footer-school').innerText = systemData.classInfo.schoolName;
                document.getElementById('footer-school-name').innerText = `${systemData.classInfo.schoolName} • 溫馨守護每一刻 💛`;
            }

            const rememberedId = localStorage.getItem('ncm309_remembered_parent_id');
            if (rememberedId && systemData.students[rememberedId]) {
                document.getElementById('login-student-id').value = rememberedId;
                document.getElementById('parent-remember-me').checked = true;
                autoLoginParent(rememberedId, systemData);
            }
        };

        async function syncLoadData() {
            try {
                const response = await fetch(`${CLOUD_BIN_URL}/latest`, {
                    headers: { 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' }
                });
                if (response.ok) {
                    const cloudResult = await response.json();
                    if (cloudResult && cloudResult.record) {
                        localStorage.setItem('ncm309_school_data', JSON.stringify(cloudResult.record));
                    }
                }
            } catch (e) {
                console.log("使用本地快取資料");
            }
        }

        function getSystemData() {
            let data = localStorage.getItem('ncm309_school_data');
            const freshData = generateDefaultData();

            if (!data) {
                localStorage.setItem('ncm309_school_data', JSON.stringify(freshData));
                return freshData;
            }

            try {
                let parsed = JSON.parse(data);
                if (!parsed.classInfo) parsed.classInfo = freshData.classInfo;
                if (!parsed.notesList || parsed.notesList.length === 0) parsed.notesList = freshData.notesList;
                if (!parsed.activeNoteId) parsed.activeNoteId = freshData.activeNoteId;
                if (!parsed.students || Object.keys(parsed.students).length < 25) {
                    parsed.students = freshData.students;
                }
                return parsed;
            } catch (e) {
                return freshData;
            }
        }

        function getTaiwanTaipeiDateString() {
            const now = new Date();
            const options = { timeZone: 'Asia/Taipei', year: 'numeric', month: 'numeric', day: 'numeric', weekday: 'long' };
            const formatter = new Intl.DateTimeFormat('zh-TW', options);
            const parts = formatter.formatToParts(now);
            
            let year = '', month = '', day = '', weekday = '';
            parts.forEach(part => {
                if (part.type === 'year') year = parseInt(part.value) - 1911;
                if (part.type === 'month') month = part.value;
                if (part.type === 'day') day = part.value;
                if (part.type === 'weekday') weekday = part.value;
            });
            return `民國 ${year} 年 ${month} 月 ${day} 日 (${weekday})`;
        }

        function generateDefaultData() {
            const names = ["黃琨翔", "陳秉軒", "杜晨翔", "劉景碩", "王宇童", "吳立翔", "陳宇恩", "林楷諾", "李柏衡", "林晉翰", "徐堉綸", "紀孟希", "徐晟瀚", "王知言", "蔡佩穎", "鄭詠心", "郭聿芸", "楊茲甯", "王岑芝", "吳涵儒", "洪楀晴", "林芷萱", "潘若穎", "焉語霓", "蘇唯心"];
            const ids = ["113056", "113058", "113164", "113166", "113245", "113140", "113248", "113010", "113037", "113279", "113123", "113200", "113015", "113017", "113151", "113284", "113178", "113204", "113021", "113205", "113232", "113208", "113129", "113134", "113212"];
            let students = {};
            ids.forEach((id, index) => {
                students[id] = { name: names[index], seat: String(index + 1), homeworkStatus: {}, injuries: [] };
            });
            students["123"] = { name: "測試帳號", seat: "30", homeworkStatus: {}, injuries: [] };

            const defaultId = new Date().toISOString();
            const defaultNotesList = [{
                id: defaultId,
                date: getTaiwanTaipeiDateString(),
                content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷",
                parentMessage: "本週三有戶外教學。",
                reminder: "帶外套。"
            }];

            return { students: students, classInfo: { schoolName: "崇明國小", className: "三年九班", teacherName: "陽芯妮" }, notesList: defaultNotesList, activeNoteId: defaultId, teacherAuth: { user: "nini309", pass: "20010909" } };
        }

        let currentStudentId = null;

        function handleLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('login-student-id').value.trim();
            const rememberMe = document.getElementById('parent-remember-me').checked;
            const systemData = getSystemData();

            if (systemData.students[studentId]) {
                if (rememberMe) {
                    localStorage.setItem('ncm309_remembered_parent_id', studentId);
                } else {
                    localStorage.removeItem('ncm309_remembered_parent_id');
                }
                autoLoginParent(studentId, systemData);
            } else {
                alert("找不到此學號！請確認輸入是否正確。");
            }
        }

        function autoLoginParent(studentId, systemData) {
            currentStudentId = studentId;
            sessionStorage.setItem('ncm309_logged_student', studentId);

            const student = systemData.students[studentId];
            const cInfo = systemData.classInfo || { schoolName: "崇明國小", className: "三年九班", teacherName: "老師" };

            document.getElementById('header-child-name').innerText = student.name;
            document.getElementById('header-className-display').innerText = `${cInfo.className} • 座號 ${student.seat} 號`;
            document.getElementById('note-teacher-label').innerHTML = `<i class="fa-solid fa-heart text-rose-500"></i> ${cInfo.teacherName}老師提醒 / 給家長的話：`;

            renderDashboard(student, systemData);

            document.getElementById('login-section').classList.add('hidden');
            document.getElementById('app-header').classList.remove('hidden');
            document.getElementById('dashboard-section').classList.remove('hidden');
        }

        function renderDashboard(student, systemData) {
            // 找到當前當天聯絡簿（在 notesList 中依序排列，第一個通常為最新）
            const activeIndex = systemData.notesList.findIndex(n => n.id === systemData.activeNoteId);
            const activeNote = activeIndex !== -1 ? systemData.notesList.activeIndex : systemData.notesList[0];
            const yesterdayNote = systemData.notesList.length > 1 ? systemData.notesList[1] : null;

            // 第一區塊：當天聯絡簿內容與老師提醒
            if (activeNote) {
                document.getElementById('note-display-date').innerText = activeNote.date;
                document.getElementById('note-display-content').innerText = activeNote.content;
                document.getElementById('note-display-message').innerText = activeNote.parentMessage || "尚無留言";
                document.getElementById('note-display-reminder').innerText = activeNote.reminder || "無";
            } else {
                document.getElementById('note-display-date').innerText = "無日期";
                document.getElementById('note-display-content').innerText = "目前尚無當天聯絡簿";
                document.getElementById('note-display-message').innerText = "尚無留言";
                document.getElementById('note-display-reminder').innerText = "無";
            }

            // 第二區塊：昨天聯絡簿內容
            const yesterdayContainer = document.getElementById('yesterday-note-content');
            if (yesterdayNote) {
                yesterdayContainer.innerHTML = `
                    <p class="font-bold text-amber-900 text-xs mb-1">📅 ${yesterdayNote.date}</p>
                    <p class="text-xs text-slate-700 whitespace-pre-line">${yesterdayNote.content}</p>
                    ${yesterdayNote.parentMessage ? `<p class="text-xs text-amber-900 mt-2 bg-amber-100/60 p-2 rounded-xl">老師的話：${yesterdayNote.parentMessage}</p>` : ''}
                `;
            } else {
                yesterdayContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無上一個聯絡簿紀錄</p>`;
            }

            const statusMap = {
                "1": { text: "繳交", color: "bg-emerald-50 text-emerald-700 border-emerald-200" },
                "2": { text: "已補交", color: "bg-blue-50 text-blue-700 border-blue-200" },
                "3": { text: "未完成", color: "bg-amber-50 text-amber-700 border-amber-200" },
                "4": { text: "需訂正、補交", color: "bg-rose-50 text-rose-700 border-rose-200" }
            };

            // 第三區塊：昨天作業今天繳交狀態
            const yesterdayHwContainer = document.getElementById('yesterday-homework-list');
            yesterdayHwContainer.innerHTML = '';
            if (yesterdayNote && yesterdayNote.content) {
                const yestHwLines = yesterdayNote.content.split('\n').filter(line => line.trim() !== '');
                const yestStudentStatus = (student.homeworkStatus && student.homeworkStatus[yesterdayNote.id]) || {};

                if (yestHwLines.length === 0) {
                    yesterdayHwContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無登記作業</p>`;
                } else {
                    yestHwLines.forEach((line, idx) => {
                        const statusKey = yestStudentStatus[idx] || "3";
                        const s = statusMap[statusKey];
                        yesterdayHwContainer.innerHTML += `
                            <div class="flex items-center justify-between p-3 rounded-2xl bg-amber-50/40 border border-amber-100 text-xs">
                                <span class="font-medium text-slate-700">${line}</span>
                                <span class="px-3 py-1 rounded-full font-bold border ${s.color}">${s.text}</span>
                            </div>
                        `;
                    });
                }
            } else {
                yesterdayHwContainer.innerHTML = `<p class="text-xs text-slate-400 text-center py-2">昨日無作業狀態追蹤</p>`;
            }

            // 第四區塊：需家長協助完成之作業 (自動篩選帶有「家長」、「親子」、「簽名」、「協助」、「共學」等關鍵字之項目)
            const parentAssistContainer = document.getElementById('parent-assist-homework-list');
            parentAssistContainer.innerHTML = '';
            let assistItems = [];
            
            systemData.notesList.forEach(note => {
                if (note.content) {
                    const lines = note.content.split('\n');
                    lines.forEach((line, lineIdx) => {
                        if (line.includes("家長") || line.includes("親子") || line.includes("簽名") || line.includes("協助") || line.includes("共學") || line.includes("帶")) {
                            assistItems.push({ date: note.date, text: line });
                        }
                    });
                }
            });

            if (assistItems.length === 0) {
                parentAssistContainer.innerHTML = `<p class="text-slate-500 text-center py-2">目前無特別需家長協助之項目 ✨</p>`;
            } else {
                assistItems.slice(0, 3).forEach(item => {
                    parentAssistContainer.innerHTML += `
                        <div class="p-2.5 bg-orange-50/60 rounded-xl border border-orange-200 mb-2">
                            <span class="font-bold text-orange-900">📌 (${item.date})</span>
                            <p class="text-slate-700 mt-0.5">${item.text}</p>
                        </div>
                    `;
                });
            }

            // 第二頁：傷病通知紀錄（雙區塊：未確認 vs 已確認）
            const pendingContainer = document.getElementById('pending-injury-list');
            const confirmedContainer = document.getElementById('confirmed-injury-list');
            pendingContainer.innerHTML = '';
            confirmedContainer.innerHTML = '';

            let pendingCount = 0;
            let confirmedCount = 0;

            if (!student.injuries || student.injuries.length === 0) {
                pendingContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">目前無待確認的傷病通知 🌸</p>`;
                confirmedContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無已確認的傷病紀錄檔案</p>`;
            } else {
                student.injuries.forEach((inj, index) => {
                    const isConfirmed = inj.confirmed === true;
                    const htmlCard = `
                        <div class="p-4 rounded-2xl ${isConfirmed ? 'bg-emerald-50/40 border-emerald-200' : 'bg-rose-50/60 border-rose-200'} border text-xs space-y-2 shadow-sm">
                            <div class="flex justify-between items-center">
                                <span class="font-bold ${isConfirmed ? 'text-emerald-800' : 'text-rose-700'}">${inj.date} ${inj.time}</span>
                                <span class="text-slate-600">處理：${inj.nurse}</span>
                            </div>
                            <div>
                                <p class="font-bold text-slate-800">狀況：${inj.symptom}</p>
                                <p class="text-slate-600 mt-0.5">地點：${inj.location}</p>
                            </div>
                            <div class="bg-white p-3 rounded-xl border ${isConfirmed ? 'border-emerald-100' : 'border-rose-100'} text-slate-700">
                                <p class="font-semibold ${isConfirmed ? 'text-emerald-800' : 'text-rose-700'}">處理經過：</p>
                                <p class="mt-0.5">${inj.treatment}</p>
                            </div>
                            <div class="pt-2 border-t ${isConfirmed ? 'border-emerald-200/60' : 'border-rose-200/60'} flex justify-between items-center">
                                <span class="text-[11px] ${isConfirmed ? 'text-emerald-700 font-bold' : 'text-amber-700 font-bold'}">
                                    <i class="fa-solid ${isConfirmed ? 'fa-circle-check' : 'fa-clock'} mr-1"></i>
                                    ${isConfirmed ? '已於 ' + inj.confirmTime + ' 確認收到' : '等待家長確認'}
                                </span>
                                ${!isConfirmed ? `
                                    <button onclick="confirmInjury(${index})" class="bg-amber-500 hover:bg-amber-600 text-white font-bold px-3 py-1.5 rounded-xl shadow-sm transition text-[11px]">
                                        確認已收到訊息 💛
                                    </button>
                                ` : `
                                    <span class="bg-emerald-100 text-emerald-800 px-3 py-1 rounded-xl font-bold text-[11px]">已完成確認 ✓</span>
                                `}
                            </div>
                        </div>
                    `;

                    if (isConfirmed) {
                        confirmedCount++;
                        confirmedContainer.innerHTML += htmlCard;
                    } else {
                        pendingCount++;
                        pendingContainer.innerHTML += htmlCard;
                    }
                });

                if (pendingCount === 0) {
                    pendingContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">太棒了！所有傷病通知皆已確認完畢 ✨</p>`;
                }
                if (confirmedCount === 0) {
                    confirmedContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">尚無已確認的傷病紀錄</p>`;
                }
            }

            document.getElementById('pending-injury-count').innerText = pendingCount;
            document.getElementById('confirmed-injury-count').innerText = confirmedCount;
        }

        async function confirmInjury(injuryIndex) {
            const systemData = getSystemData();
            const now = new Date();
            const timeString = `${now.getMonth() + 1}/${now.getDate()} ${String(now.getHours()).padStart(2, '0')}:${String(now.getMinutes()).padStart(2, '0')}`;
            
            systemData.students[currentStudentId].injuries[injuryIndex].confirmed = true;
            systemData.students[currentStudentId].injuries[injuryIndex].confirmTime = timeString;
            
            localStorage.setItem('ncm309_school_data', JSON.stringify(systemData));
            try {
                await fetch(CLOUD_BIN_URL, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json', 'X-Master-Key': '$2a$10$95bW31HqL48Jb8Q5Vf3d1eK7n9bW31HqL48Jb8Q5Vf3d1eK7n9bW3' },
                    body: JSON.stringify(systemData)
                });
            } catch(e) {}

            alert("已成功回報學校：確認收到傷病通知！");
            renderDashboard(systemData.students[currentStudentId], systemData);
        }

        function switchTab(tab) {
            document.getElementById('tab-today').className = tab === 'today' ? "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-amber-900 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-amber-800/70 transition";
            document.getElementById('tab-injury').className = tab === 'injury' ? "flex-1 py-2 text-xs font-bold rounded-xl bg-white text-amber-900 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-amber-800/70 transition";

            document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
            document.getElementById('view-injury').classList.toggle('hidden', tab !== 'injury');
        }

        function logout() {
            currentStudentId = null;
            sessionStorage.removeItem('ncm309_logged_student');
            document.getElementById('login-student-id').value = localStorage.getItem('ncm309_remembered_parent_id') || '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
