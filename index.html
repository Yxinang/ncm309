<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>309 班級 - 家長即時守護系統</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="bg-slate-50 font-sans text-slate-800 flex flex-col min-h-screen">

    <header id="app-header" class="bg-indigo-600 text-white shadow-md sticky top-0 z-50 hidden">
        <div class="max-w-md mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center space-x-3">
                <div class="bg-white/20 p-2 rounded-full">
                    <i class="fa-solid fa-child-reaching text-lg"></i>
                </div>
                <div>
                    <h1 class="font-bold text-base" id="header-child-name">載入中...</h1>
                    <p class="text-xs text-indigo-200" id="header-child-info">三年九班</p>
                </div>
            </div>
            <button onclick="logout()" class="text-xs text-white bg-indigo-500 hover:bg-indigo-700 px-3 py-1.5 rounded-lg transition flex items-center gap-1">
                <i class="fa-solid fa-right-from-bracket"></i> 登出
            </button>
        </div>
    </header>

    <main class="max-w-md mx-auto px-4 py-6 flex-grow w-full space-y-6">

        <!-- 登入畫面 -->
        <section id="login-section" class="bg-white rounded-2xl p-6 shadow-sm border border-slate-100 space-y-6 my-auto">
            <div class="text-center space-y-2">
                <div class="w-16 h-16 bg-indigo-100 text-indigo-600 rounded-full flex items-center justify-center mx-auto text-2xl shadow-inner">
                    <i class="fa-solid fa-school"></i>
                </div>
                <h2 class="text-xl font-bold text-slate-800">歡迎來到 309 班級</h2>
                <p class="text-xs text-slate-500">請輸入您孩子的**學號**以查看今日聯絡簿與作業</p>
            </div>

            <form onsubmit="handleLogin(event)" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-slate-600 mb-1">學生學號</label>
                    <input type="text" id="login-student-id" required placeholder="例如：30901" class="w-full px-3 py-2.5 rounded-xl border border-slate-300 text-sm focus:ring-2 focus:ring-indigo-500 outline-none">
                </div>
                <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3 rounded-xl shadow transition text-sm">
                    進入孩子專區
                </button>
            </form>

            <div class="pt-4 border-t border-slate-100 flex justify-between items-center text-xs text-slate-400">
                <span>崇明國小三年九班</span>
                <a href="teacher.html" class="text-indigo-600 hover:underline font-medium"><i class="fa-solid fa-lock mr-1"></i>教師後台登入</a>
            </div>
        </section>

        <!-- 儀表板畫面 -->
        <div id="dashboard-section" class="hidden space-y-6">
            <div class="flex bg-slate-200 p-1 rounded-xl">
                <button onclick="switchTab('today')" id="tab-today" class="flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition">
                    <i class="fa-solid fa-bolt mr-1"></i> 今日聯絡簿與即時狀況
                </button>
                <button onclick="switchTab('history')" id="tab-history" class="flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition">
                    <i class="fa-solid fa-clock-rotate-left mr-1"></i> 所有歷史紀錄
                </button>
            </div>

            <div id="view-today" class="space-y-6">
                <!-- 聯絡簿抄寫內容 -->
                <section class="bg-gradient-to-br from-amber-50 to-orange-50 rounded-2xl p-5 shadow-sm border border-amber-200 space-y-3">
                    <div class="flex justify-between items-center border-b border-amber-200 pb-2">
                        <h2 class="font-bold text-amber-900 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-book-bookmark text-amber-600"></i> 今日聯絡簿抄寫內容
                        </h2>
                        <span class="text-[11px] text-amber-700 font-medium" id="note-display-date">載入中...</span>
                    </div>
                    <div class="bg-white/80 p-3.5 rounded-xl border border-amber-100">
                        <p class="text-xs text-slate-800 whitespace-pre-line font-medium leading-relaxed" id="note-display-content">載入中...</p>
                    </div>
                    
                    <!-- 老師叮嚀 / 給家長的話 -->
                    <div class="bg-amber-100/80 p-3 rounded-xl border border-amber-200 space-y-1">
                        <p class="text-[11px] font-bold text-amber-900 flex items-center gap-1">
                            <i class="fa-solid fa-bullhorn text-amber-600"></i> 老師給家長的話：
                        </p>
                        <p class="text-xs text-amber-950 font-medium leading-relaxed pl-4" id="note-display-message">尚無留言</p>
                    </div>

                    <div class="flex items-center gap-2 text-xs text-amber-800 bg-amber-100/60 p-2.5 rounded-lg">
                        <i class="fa-solid fa-circle-exclamation text-amber-600"></i>
                        <p><span class="font-bold">叮嚀備註：</span><span id="note-display-reminder">載入中...</span></p>
                    </div>
                </section>

                <!-- 作業狀況 -->
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-list-check text-indigo-500"></i> 我的作業繳交狀況
                        </h2>
                        <span class="text-xs text-indigo-600 font-bold" id="homework-summary">0 / 0 已交</span>
                    </div>
                    <div class="space-y-2.5" id="today-homework-list"></div>
                </section>

                <!-- 傷病通知 -->
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100">
                    <div class="flex justify-between items-center mb-4">
                        <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2">
                            <i class="fa-solid fa-notes-medical text-rose-500"></i> 傷病通知單記錄
                        </h2>
                        <span class="text-xs text-rose-600 font-bold" id="today-injury-count">0 筆</span>
                    </div>
                    <div class="space-y-3" id="today-injury-list"></div>
                </section>
            </div>

            <div id="view-history" class="space-y-6 hidden">
                <section class="bg-white rounded-2xl p-5 shadow-sm border border-slate-100 space-y-3">
                    <h2 class="font-bold text-slate-700 text-sm flex items-center gap-2 border-b pb-2">
                        <i class="fa-solid fa-box-archive text-indigo-500"></i> 過往傷病紀錄總覽
                    </h2>
                    <div class="space-y-3" id="all-history-list"></div>
                </section>
            </div>
        </div>
    </main>

    <footer class="py-3 text-center text-xs text-slate-400">
        <p>崇明國小三年九班 • 隨時守護孩子安全</p>
    </footer>

    <script>
        function getSystemData() {
            const data = localStorage.getItem('ncm309_school_data');
            if (!data) {
                const defaultData = {
                    students: {
                        "30901": {
                            name: "王小明", seat: "01",
                            homework: [
                                { name: "國文習作第 4 課", status: "submitted" },
                                { name: "數學隨堂練習卷", status: "submitted" },
                                { name: "社會課本預習", status: "pending" }
                            ],
                            injuries: []
                        },
                        "30902": {
                            name: "李小華", seat: "02",
                            homework: [
                                { name: "國文習作第 4 課", status: "submitted" },
                                { name: "數學隨堂練習卷", status: "pending" },
                                { name: "社會課本預習", status: "pending" }
                            ],
                            injuries: []
                        }
                    },
                    contactNote: {
                        date: "2026 年 11 月 2 日 (星期一)",
                        content: "1. 國文習作第 4 課完成\n2. 數學隨堂練習卷訂正",
                        parentMessage: "各位家長好，本週三有戶外教學，請記得幫孩子準備輕便雨衣與水壺。",
                        reminder: "記得帶外套。"
                    }
                };
                localStorage.setItem('ncm309_school_data', JSON.stringify(defaultData));
                return defaultData;
            }
            return JSON.parse(data);
        }

        let currentStudentId = null;

        function handleLogin(event) {
            event.preventDefault();
            const studentId = document.getElementById('login-student-id').value.trim();
            const systemData = getSystemData();

            if (systemData.students[studentId]) {
                currentStudentId = studentId;
                const student = systemData.students[studentId];

                document.getElementById('header-child-name').innerText = student.name;
                document.getElementById('header-child-info').innerText = `座號 ${student.seat} 號`;

                renderDashboard(student, systemData.contactNote);

                document.getElementById('login-section').classList.add('hidden');
                document.getElementById('app-header').classList.remove('hidden');
                document.getElementById('dashboard-section').classList.remove('hidden');
            } else {
                alert("找不到此學號！請確認輸入是否正確（測試可輸入：30901 或 30902）。");
            }
        }

        function renderDashboard(student, note) {
            document.getElementById('note-display-date').innerText = note.date;
            document.getElementById('note-display-content').innerText = note.content;
            document.getElementById('note-display-message').innerText = note.parentMessage || "尚無留言";
            document.getElementById('note-display-reminder').innerText = note.reminder;

            const hwContainer = document.getElementById('today-homework-list');
            hwContainer.innerHTML = '';
            let submittedCount = 0;
            student.homework.forEach(hw => {
                if (hw.status === 'submitted') submittedCount++;
                const isDone = hw.status === 'submitted';
                hwContainer.innerHTML += `
                    <div class="flex items-center justify-between p-2.5 rounded-xl bg-slate-50 border border-slate-100 text-xs">
                        <span class="font-medium text-slate-700">${hw.name}</span>
                        <span class="px-2 py-0.5 rounded-full font-medium ${isDone ? 'bg-emerald-50 text-emerald-600' : 'bg-amber-50 text-amber-600'}">
                            ${isDone ? '已繳交' : '尚未繳交'}
                        </span>
                    </div>
                `;
            });
            document.getElementById('homework-summary').innerText = `${submittedCount} / ${student.homework.length} 已交`;

            const injuryContainer = document.getElementById('today-injury-list');
            const historyContainer = document.getElementById('all-history-list');
            injuryContainer.innerHTML = '';
            historyContainer.innerHTML = '';
            document.getElementById('today-injury-count').innerText = `${student.injuries.length} 筆`;

            if (student.injuries.length === 0) {
                injuryContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">近期無傷病通知紀錄 🎉</p>`;
                historyContainer.innerHTML = `<p class="text-center text-xs text-slate-400 py-3">無過往歷史紀錄</p>`;
            } else {
                student.injuries.forEach(inj => {
                    injuryContainer.innerHTML += `
                        <div class="p-3 rounded-xl bg-rose-50 border border-rose-100 text-xs space-y-1">
                            <p class="font-bold text-rose-600">${inj.date} ${inj.time} - ${inj.symptom}</p>
                            <p class="text-slate-600">地點：${inj.location}</p>
                            <p class="text-slate-700 bg-white p-2 rounded border border-rose-100">處置：${inj.treatment}</p>
                        </div>
                    `;
                    historyContainer.innerHTML += `
                        <div class="p-3 rounded-xl bg-slate-50 border text-xs space-y-1">
                            <span class="font-bold text-indigo-600">${inj.date} 傷病紀錄</span>
                            <p class="text-slate-700">${inj.symptom} (${inj.treatment})</p>
                        </div>
                    `;
                });
            }
        }

        function switchTab(tab) {
            document.getElementById('tab-today').className = tab === 'today' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";
            document.getElementById('tab-history').className = tab === 'history' ? "flex-1 py-2 text-xs font-bold rounded-lg bg-white text-indigo-600 shadow-sm transition" : "flex-1 py-2 text-xs font-bold rounded-lg text-slate-600 transition";

            document.getElementById('view-today').classList.toggle('hidden', tab !== 'today');
            document.getElementById('view-history').classList.toggle('hidden', tab !== 'history');
        }

        function logout() {
            currentStudentId = null;
            document.getElementById('login-student-id').value = '';
            document.getElementById('login-section').classList.remove('hidden');
            document.getElementById('app-header').classList.add('hidden');
            document.getElementById('dashboard-section').classList.add('hidden');
        }
    </script>
</body>
</html>
